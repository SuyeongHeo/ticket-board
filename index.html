    summary.innerHTML =
      (searchAll && tq ? '<span style="font-size:12px; color:#2563eb; font-weight:600;">모든 콘서트 · ' + groups.length + '개에서 발견</span>' : '') +
      (tq && !searchAll ? '<span style="font-size:12px; color:#2563eb; font-weight:600;">검색 결과</span>' : '') +
      '<span style="font-size:13px; color:#555;">완료 <b>' + doneCnt + '</b> / ' + total + '</span>' +
      '<span style="flex:1 1 120px; min-width:100px; height:8px; background:#eeece6; border-radius:4px; overflow:hidden;">' +
        '<span style="display:block; height:100%; width:' + pct + '%; background:#2ea043; border-radius:4px;"></span></span>' +
      '<span style="font-size:13px; font-weight:600; color:#2ea043;">' + pct + '%</span>' +
      (overdue > 0 ? '<span style="font-size:12px; color:#c0392b;">지난 날짜 미완료 ' + overdue + '건</span>' : '');

    filterRow.innerHTML = '';
    [['open','미완료 ' + (total - doneCnt)], ['done','완료 ' + doneCnt], ['all','전체 ' + total]].forEach(([v, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = 'font-size:12px; padding:6px 12px; height:auto;' +
        (mode === v ? ' background:#2563eb; color:#fff; border-color:#2563eb;' : '');
      b.onclick = () => { mode = v; refresh(); };
      filterRow.appendChild(b);
    });

    listWrap.innerHTML = '';
    let shown = 0;
    groups.forEach(g => {
      const rows = g.entries.filter(e => passesMode(e.task));
      if(rows.length === 0) return;

      if(searchAll && tq){
        const gAccent = colorFor(g.name);
        const owner = getOwnerForKnownName(g.name);
        const head = document.createElement('div');
        head.style.cssText = 'position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:7px; flex-wrap:wrap; background:#f6f5f1; border-top:1px solid #e8e6e0; padding:7px 12px;';
        head.innerHTML =
          '<span style="width:9px;height:9px;border-radius:50%;background:' + gAccent + ';flex-shrink:0;"></span>' +
          '<span style="font-size:12.5px; font-weight:700; color:' + gAccent + ';">' + escapeHtml(g.name) + '</span>' +
          (owner ? '<span style="font-size:9px; padding:1px 6px; border-radius:20px; background:' + ownerColorFor(owner) + '22; border:1px solid ' + ownerColorFor(owner) + '55; color:' + ownerColorFor(owner) + ';">' + escapeHtml(getOwnerDisplay(owner)) + '</span>' : '') +
          ddayBadgeHtml(g.name, 9) +
          '<span style="flex:1;"></span>' +
          '<span style="font-size:11px; color:#888;">' + rows.length + '건</span>';
        listWrap.appendChild(head);
        rows.forEach(e => { shown++; listWrap.appendChild(makeRow(e, true, true)); });
      } else {
        let lastDate = null;
        rows.forEach(e => {
          if(e.date !== lastDate){
            lastDate = e.date;
            const past = parseDateLabel(e.date) < today;
            const head = document.createElement('div');
            head.style.cssText = 'position:sticky; top:0; z-index:1; background:#faf9f6; border-top:1px solid #e8e6e0; padding:6px 12px; font-size:11px; font-weight:700; color:' + (past ? '#aaa' : '#555') + ';';
            head.textContent = formatDateShort(e.date) + (past ? ' · 지남' : '');
            listWrap.appendChild(head);
          }
          shown++;
          listWrap.appendChild(makeRow(e, false, false));
        });
      }
    });

    const widenBtn = (label, big) => {
      const wrap = document.createElement('div');
      wrap.style.cssText = big
        ? 'padding:0 16px 18px; text-align:center;'
        : 'padding:10px 16px; text-align:center; background:#faf9f6; border-top:1px solid #e8e6e0;';
      const wb = document.createElement('button');
      wb.textContent = label;
      wb.style.cssText = big ? 'font-size:12px; padding:7px 14px; height:auto;' : 'font-size:11px; padding:5px 12px; height:auto;';
      wb.onclick = () => { searchAll = true; refresh(); };
      wrap.appendChild(wb);
      return wrap;
    };

    if(shown === 0){
      const empty = document.createElement('div');
      empty.style.cssText = 'padding:22px 16px; font-size:12px; color:#999; text-align:center;';
      if(tq){
        empty.textContent = searchAll
          ? ('어느 콘서트에도 "' + taskQuery.trim() + '"에 해당하는 업무가 없어요.')
          : ('"' + current + '"에는 "' + taskQuery.trim() + '"에 해당하는 업무가 없어요.');
        listWrap.appendChild(empty);
        if(!searchAll) listWrap.appendChild(widenBtn('모든 콘서트에서 찾아보기', true));
      } else {
        empty.textContent = mode === 'open' ? '미완료 할 일이 없어요. 전부 끝냈네요.' :
          (mode === 'done' ? '완료한 할 일이 아직 없어요.' : '등록된 할 일이 없어요.');
        listWrap.appendChild(empty);
      }
    } else if(tq && !searchAll){
      listWrap.appendChild(widenBtn('다른 콘서트에서도 찾기', false));
    }
  }

  refresh();
  backdrop.appendChild(box);
  backdrop.addEventListener('mousedown', (e) => { if(e.target === backdrop) close(); });
  document.body.appendChild(backdrop);
}

function openShowDateManager(initialProjName){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.style.width = '820px';

  const title = document.createElement('div');
  title.className = 'modal-title';
  title.textContent = '체크리스트 자동 입력';
  box.appendChild(title);

  const tabRow = document.createElement('div');
  tabRow.style.cssText = 'display:flex; gap:6px; margin-bottom:16px;';
  const tabGen = document.createElement('button');
  const tabTpl = document.createElement('button');
  tabGen.textContent = '업무 자동 생성';
  tabTpl.textContent = '업무 템플릿 편집';
  tabRow.appendChild(tabGen);
  tabRow.appendChild(tabTpl);
  box.appendChild(tabRow);

  const paneGen = document.createElement('div');
  const paneTpl = document.createElement('div');
  box.appendChild(paneGen);
  box.appendChild(paneTpl);

  let activeTab = 'gen';
  function syncTabs(){
    const on = 'background:#2563eb; color:#fff; border-color:#2563eb;';
    const off = '';
    tabGen.style.cssText = activeTab === 'gen' ? on : off;
    tabTpl.style.cssText = activeTab === 'tpl' ? on : off;
    paneGen.style.display = activeTab === 'gen' ? 'block' : 'none';
    paneTpl.style.display = activeTab === 'tpl' ? 'block' : 'none';
  }
  tabGen.onclick = () => { activeTab = 'gen'; syncTabs(); };
  tabTpl.onclick = () => { activeTab = 'tpl'; renderTplPane(); syncTabs(); };

  /* ---------- 탭 1 : 공연일 등록 & 업무 생성 ---------- */
  const listWrap = document.createElement('div');
  listWrap.style.cssText = 'margin-bottom:20px;';
  paneGen.appendChild(listWrap);

  function renderShowDateList(){
    listWrap.innerHTML = '';
    const names = Object.keys(showDates).filter(n => showDates[n]);
    const head = document.createElement('div');
    head.style.cssText = 'font-size:12px; color:#666; margin-bottom:8px; font-weight:600;';
    head.textContent = '등록된 공연일 (' + names.length + ')';
    listWrap.appendChild(head);
    if(names.length === 0){
      const p = document.createElement('div');
      p.style.cssText = 'font-size:12px; color:#999; padding:10px 0 4px;';
      p.textContent = '아직 등록된 공연일이 없어요. 아래에서 콘서트와 공연일을 선택해 주세요.';
      listWrap.appendChild(p);
      return;
    }
    names.sort((a,b) => {
      const na = getDdayNumber(a), nb = getDdayNumber(b);
      const fa = na < 0 ? 1 : 0, fb = nb < 0 ? 1 : 0;
      if(fa !== fb) return fa - fb;
      return fa ? (nb - na) : (na - nb);
    });
    const table = document.createElement('div');
    table.style.cssText = 'border:1px solid #e8e6e0; border-radius:10px; overflow:hidden;';
    names.forEach((n, i) => {
      const cnt = countProjectPending(n);
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; align-items:center; gap:10px; padding:9px 12px; font-size:12px;' +
        (i % 2 ? 'background:#faf9f6;' : 'background:#fff;');
      const lists = getAllBaseDateLists(n);
      const showD = fromISODate(getShowDate(n));
      const showCnt = (lists.show || []).length;
      const extra = BASE_TYPES.filter(bt => bt.id !== 'show' && (lists[bt.id] || []).length > 0)
        .map(bt => {
          const cnt = lists[bt.id].length;
          const first = earliestDate(lists[bt.id]);
          return '<span style="color:' + bt.color + ';">' + bt.prefix + ' ' +
            formatDateShort(fromISODate(first)) + (cnt > 1 ? ' 외 ' + (cnt-1) : '') + '</span>';
        })
        .join(' · ');
      const tplName = getShowTemplateName(n);
      row.innerHTML =
        '<span style="flex:1 1 auto; font-weight:600; color:' + colorFor(n) + '; word-break:break-all;">' + escapeHtml(n) + '</span>' +
        (tplName ? '<span style="flex:0 0 auto; font-size:9px; padding:1px 6px; border-radius:20px; background:#eef2ff; border:1px solid #c9d4f5; color:#4a5fb5;">' + escapeHtml(tplName) + '</span>' : '') +
        ddayBadgeHtml(n, 10) +
        '<span style="flex:0 0 230px; color:#666; text-align:right; line-height:1.5;">' + formatDateShort(showD) +
          (showCnt > 1 ? ' <span style="color:#999;">외 ' + (showCnt-1) + '일</span>' : '') +
          (extra ? '<br>' + extra : '') + '</span>' +
        '<span style="flex:0 0 112px; text-align:right; color:' + (cnt.overdue ? '#c0392b' : '#999') + ';">' +
          '미완료 ' + cnt.pending + '건' + (cnt.overdue ? ' · 지연 ' + cnt.overdue : '') + '</span>';
      const editBtn = document.createElement('button');
      editBtn.textContent = '선택';
      editBtn.style.cssText = 'font-size:11px; padding:3px 9px; height:auto;';
      editBtn.onclick = () => { projSelect.value = n; onProjChange(); };
      const delBtn = document.createElement('button');
      delBtn.textContent = '삭제';
      delBtn.style.cssText = 'font-size:11px; padding:3px 9px; height:auto; color:#c0392b;';
      delBtn.onclick = () => {
        if(!confirm('"' + n + '"의 공연일 등록을 지울까요?\n(이미 만들어진 할 일/일정은 그대로 남아요)')) return;
        delete showDates[n];
        saveShowDates();
        renderShowDateList();
        renderAll();
      };
      row.appendChild(editBtn);
      row.appendChild(delBtn);
      table.appendChild(row);
    });
    listWrap.appendChild(table);
  }

  const formWrap = document.createElement('div');
  formWrap.style.cssText = 'border-top:1px solid #efeee9; padding-top:16px;';
  paneGen.appendChild(formWrap);

  const inputRow = document.createElement('div');
  inputRow.style.cssText = 'display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px;';

  const projField = document.createElement('div');
  projField.style.cssText = 'flex:1 1 160px;';
  projField.innerHTML = '<span class="modal-label">콘서트</span>';
  const projSelect = document.createElement('select');
  projSelect.className = 'modal-input';
  const knownNames = getKnownProjectNames();
  if(knownNames.length === 0){
    const opt = document.createElement('option');
    opt.value = ''; opt.textContent = '등록된 콘서트가 없어요';
    projSelect.appendChild(opt);
  } else {
    fillProjectSelect(projSelect, knownNames, '');
  }
  if(initialProjName && knownNames.includes(initialProjName)) projSelect.value = initialProjName;
  projField.appendChild(projSelect);
  inputRow.appendChild(projField);

  const tplField = document.createElement('div');
  tplField.style.cssText = 'flex:0 0 150px;';
  tplField.innerHTML = '<span class="modal-label">템플릿 (예매처)</span>';
  const tplSelect = document.createElement('select');
  tplSelect.className = 'modal-input';
  function fillTemplateOptions(keepValue){
    const prev = keepValue !== undefined ? keepValue : tplSelect.value;
    tplSelect.innerHTML = '';
    taskTemplates.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.name + ' (' + (s.items ? s.items.length : 0) + ')';
      tplSelect.appendChild(opt);
    });
    if(prev && taskTemplates.some(s => s.id === prev)) tplSelect.value = prev;
  }
  fillTemplateOptions('');
  tplSelect.addEventListener('change', () => {
    Object.keys(checkState).forEach(k => delete checkState[k]);
    renderPreview();
  });
  tplField.appendChild(tplSelect);
  inputRow.appendChild(tplField);

  const ownerField = document.createElement('div');
  ownerField.style.cssText = 'flex:0 0 124px;';
  ownerField.innerHTML = '<span class="modal-label">담당자</span>';
  const ownerSelect = document.createElement('select');
  ownerSelect.className = 'modal-input';
  function fillOwners(){
    ownerSelect.innerHTML = '';
    const blank = document.createElement('option');
    blank.value = ''; blank.textContent = '(지정 안 함)';
    ownerSelect.appendChild(blank);
    getKnownOwners().forEach(o => {
      const opt = document.createElement('option');
      opt.value = o; opt.textContent = getOwnerDisplay(o);
      ownerSelect.appendChild(opt);
    });
  }
  fillOwners();
  ownerField.appendChild(ownerSelect);
  inputRow.appendChild(ownerField);
  formWrap.appendChild(inputRow);

  /* 기준일 입력 — 공연 2~3일, 선예매/일반예매처럼 날짜를 여러 개 넣을 수 있음.
     기한 계산의 기준은 각 목록에서 "가장 빠른 날짜" */
  let dateLists = { notice: [], open: [], show: [] };

  const dateRow = document.createElement('div');
  dateRow.style.cssText = 'margin-bottom:14px; background:#faf9f6; border:1px solid #eeece6; border-radius:10px; padding:10px 12px;';
  formWrap.appendChild(dateRow);

  function currentBaseDates(){
    const o = {};
    BASE_TYPES.forEach(bt => { o[bt.id] = earliestDate(dateLists[bt.id]); });
    return o;
  }

  function renderDateArea(){
    dateRow.innerHTML = '';
    BASE_TYPES.forEach((bt, bi) => {
      const block = document.createElement('div');
      block.style.cssText = 'padding:' + (bi === 0 ? '0' : '10px') + ' 0 0; ' +
        (bi === 0 ? '' : 'border-top:1px solid #eeece6; margin-top:8px;');

      const head = document.createElement('div');
      head.style.cssText = 'display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap;';
      const lbl = document.createElement('span');
      lbl.className = 'modal-label';
      lbl.style.cssText = 'color:' + bt.color + '; font-weight:600; margin-bottom:0;';
      const list = dateLists[bt.id];
      const first = earliestDate(list);
      lbl.textContent = bt.dateLabel + (list.length > 1 ? ' (' + list.length + '일)' : '');
      head.appendChild(lbl);
      if(list.length > 1 && first){
        const note = document.createElement('span');
        note.textContent = '기준: ' + formatDateShort(fromISODate(first));
        note.style.cssText = 'font-size:10px; color:#999;';
        head.appendChild(note);
      }
      const sp = document.createElement('span');
      sp.style.flex = '1';
      head.appendChild(sp);
      const addBtn = document.createElement('button');
      addBtn.textContent = '+ 날짜 추가';
      addBtn.style.cssText = 'font-size:11px; padding:4px 9px; height:auto;';
      addBtn.onclick = () => {
        dateLists[bt.id].push({ date: '', label: '' });
        renderDateArea();
      };
      head.appendChild(addBtn);
      block.appendChild(head);

      if(list.length === 0){
        const empty = document.createElement('div');
        empty.style.cssText = 'font-size:11px; color:#bbb; padding:2px 0 4px;';
        empty.textContent = '날짜 없음 — "+ 날짜 추가"를 눌러 입력하세요.';
        block.appendChild(empty);
      }

      list.forEach((item, idx) => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; gap:6px; align-items:center; margin-bottom:5px;';

        const dInp = document.createElement('input');
        dInp.type = 'date';
        dInp.className = 'modal-input';
        dInp.style.cssText = 'flex:0 0 150px; min-width:130px;';
        dInp.value = item.date || '';
        dInp.onchange = () => {
          item.date = dInp.value;
          Object.keys(checkState).forEach(k => delete checkState[k]);
          renderDateArea();
          renderPreview();
        };
        row.appendChild(dInp);

        const nInp = document.createElement('input');
        nInp.type = 'text';
        nInp.className = 'modal-input';
        nInp.style.cssText = 'flex:1 1 auto; min-width:100px;';
        nInp.placeholder = bt.id === 'show' ? '이름 (예: 1일차)' :
          (bt.id === 'open' ? '이름 (예: 선예매)' : '이름 (예: 오픈 공지)');
        nInp.value = item.label || '';
        // 한글 조합이 끊기지 않도록 입력 중에는 값만 담아 두고 다시 그리지 않음
        nInp.oninput = () => { item.label = nInp.value; };
        nInp.onchange = () => { item.label = nInp.value; renderPreview(); };
        row.appendChild(nInp);

        const del = document.createElement('button');
        del.textContent = '✕';
        del.title = '이 날짜 삭제';
        del.style.cssText = 'font-size:12px; padding:6px 9px; height:auto; flex-shrink:0; color:#c0392b;';
        del.onclick = () => {
          dateLists[bt.id].splice(idx, 1);
          Object.keys(checkState).forEach(k => delete checkState[k]);
          renderDateArea();
          renderPreview();
        };
        row.appendChild(del);

        block.appendChild(row);
      });

      dateRow.appendChild(block);
    });
  }

  /* 입력한 날짜들을 그대로 일정으로 만들기 위한 목록 */
  function enteredDateEvents(){
    const out = [];
    BASE_TYPES.forEach(bt => {
      const list = (dateLists[bt.id] || []).filter(x => x.date);
      const sorted = list.slice().sort((a,b) => a.date < b.date ? -1 : 1);
      sorted.forEach((item, i) => {
        const label = (item.label || '').trim();
        let text;
        if(label) text = label;
        else if(bt.id === 'show') text = sorted.length > 1 ? ('공연 ' + (i+1) + '일차') : '공연일';
        else if(bt.id === 'open') text = sorted.length > 1 ? ('티켓 오픈 ' + (i+1)) : '티켓 오픈';
        else text = sorted.length > 1 ? ('오픈 공지 ' + (i+1)) : '오픈 공지';
        out.push({
          baseId: bt.id,
          category: bt.id === 'show' ? '공연일' : (bt.id === 'open' ? '티켓오픈' : '오픈공지'),
          text: text,
          date: fromISODate(item.date),
          iso: item.date
        });
      });
    });
    out.sort((a,b) => a.date - b.date);
    return out;
  }

  const previewWrap = document.createElement('div');
  formWrap.appendChild(previewWrap);

  function onProjChange(){
    const name = projSelect.value;
    dateLists = getAllBaseDateLists(name);
    BASE_TYPES.forEach(bt => { if(!dateLists[bt.id]) dateLists[bt.id] = []; });
    renderDateArea();
    // "내 이름 설정"에서 지정한 본인을 기본 담당자로 넣어 줌 (드롭다운에서 바꿀 수 있음)
    const known = getKnownOwners();
    const o = (currentOwner && known.includes(currentOwner))
      ? currentOwner
      : (getOwnerForKnownName(name) || '');
    ownerSelect.value = known.includes(o) ? o : '';
    // 이 콘서트에 전에 쓴 템플릿이 있으면 그대로 다시 선택
    const prevTpl = getShowTemplateId(name);
    fillTemplateOptions(prevTpl && getTemplateById(prevTpl) ? prevTpl : (taskTemplates[0] ? taskTemplates[0].id : ''));
    Object.keys(checkState).forEach(k => delete checkState[k]);
    renderPreview();
  }
  projSelect.addEventListener('change', onProjChange);

  const checkState = {};

  // 템플릿 편집 중인 내용 (탭을 오가도 유지되고, "전체 템플릿 저장"을 눌러야 시트에 반영)
  let workingSets = null;
  let lastEditedSetId = '';
  function ensureWorkingSets(){
    if(workingSets) return;
    workingSets = taskTemplates.map(st => ({
      id: st.id,
      name: st.name,
      items: (st.items || []).map(i => Object.assign({}, i))
    }));
    if(workingSets.length === 0){
      workingSets = [{ id: newTemplateId(), name: '기본', items: DEFAULT_TASK_TEMPLATES.map(t => Object.assign({}, t)) }];
    }
  }

  function renderPreview(){
    previewWrap.innerHTML = '';
    const name = projSelect.value;
    const baseDates = currentBaseDates();
    if(!name){ return; }
    if(!baseDates.show && !baseDates.open && !baseDates.notice){
      const p = document.createElement('div');
      p.style.cssText = 'font-size:12px; color:#999; padding:6px 0;';
      p.textContent = '위에서 기준일(공연일 · 티켓오픈일 · 오픈공지일)을 입력하면 해야 할 일과 기한이 자동으로 계산돼요.';
      previewWrap.appendChild(p);
      return;
    }
    const tplSet = getTemplateById(tplSelect.value);
    // 입력한 날짜들을 그대로 일정으로 (공연 2일차, 선예매 등)
    const dateEvents = enteredDateEvents().map(ev => ({ ev: ev, date: ev.date }));
    // 각 항목을 자기 기준일로 계산한 뒤 실제 날짜순으로 정렬
    const sorted = dateEvents.concat((tplSet ? (tplSet.items || []) : []).slice()
      .map(t => {
        const bIso = baseIsoFor(t, baseDates);
        return { tpl: t, date: bIso ? dateFromOffset(bIso, t.offset) : null };
      }))
      .sort((a,b) => {
        if(a.date && b.date) return a.date - b.date;
        if(a.date) return -1;
        if(b.date) return 1;
        if(!a.tpl || !b.tpl) return 0;
        return (baseRankOf(a.tpl) - baseRankOf(b.tpl)) || ((a.tpl.offset||0) - (b.tpl.offset||0));
      });
    // 기준일이 비어서 만들 수 없는 항목을 기준별로 집계
    const missingByBase = {};
    sorted.forEach(x => {
      if(x.date || !x.tpl) return;
      const id = baseType(x.tpl.base).id;
      missingByBase[id] = (missingByBase[id] || 0) + 1;
    });
    const missingTotal = sorted.filter(x => !x.date).length;
    if(sorted.length === 0){
      const p = document.createElement('div');
      p.style.cssText = 'font-size:12px; color:#999; padding:6px 0;';
      p.textContent = (tplSet ? '"' + tplSet.name + '" 템플릿이 비어 있어요.' : '템플릿이 없어요.') + ' "업무 템플릿 편집" 탭에서 항목을 추가해 주세요.';
      previewWrap.appendChild(p);
      return;
    }

    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex; align-items:center; justify-content:space-between; margin:4px 0 8px;';
    const label = document.createElement('div');
    label.style.cssText = 'font-size:12px; color:#666; font-weight:600;';
    label.textContent = (tplSet ? tplSet.name + ' · ' : '') + '만들 항목 (' + sorted.length + ')';
    bar.appendChild(label);
    const toggleAll = document.createElement('button');
    toggleAll.textContent = '전체 선택 / 해제';
    toggleAll.style.cssText = 'font-size:11px; padding:3px 9px; height:auto;';
    bar.appendChild(toggleAll);
    previewWrap.appendChild(bar);

    const table = document.createElement('div');
    table.style.cssText = 'border:1px solid #e8e6e0; border-radius:10px; overflow:hidden; max-height:280px; overflow-y:auto;';
    const today = todayDate();
    const boxes = [];

    sorted.forEach((entry, i) => {
      const isDateEvent = !!entry.ev;
      const tpl = entry.tpl;
      const d = entry.date;
      const itemName = isDateEvent ? entry.ev.text : tpl.name;
      const dup = findExistingGenerated(name, itemName);
      const key = isDateEvent
        ? ('evt@' + entry.ev.baseId + '@' + entry.ev.iso + '@' + itemName)
        : (tpl.name + '@' + (tpl.base || 'show') + tpl.offset);
      // 기준일이 없는 항목(티켓오픈일 미입력)은 만들 수 없음
      if(!d){ checkState[key] = false; }
      // 이미 만들어 둔 항목, 또는 날짜가 이미 지나버린 항목은 기본으로 체크 해제
      else if(checkState[key] === undefined) checkState[key] = !dup && !(d < today);

      const row = document.createElement('label');
      row.style.cssText = 'display:flex; align-items:center; gap:9px; padding:8px 12px; font-size:12px;' +
        (d ? ' cursor:pointer;' : ' cursor:not-allowed; opacity:0.7;') +
        (i % 2 ? 'background:#faf9f6;' : 'background:#fff;');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!checkState[key];
      cb.disabled = !d;
      cb.onchange = () => { checkState[key] = cb.checked; };
      cb.style.flexShrink = '0';
      if(d) boxes.push(cb);
      row.appendChild(cb);

      const offBadge = document.createElement('span');
      if(isDateEvent){
        const bc = baseType(entry.ev.baseId).color;
        offBadge.style.cssText = 'flex:0 0 60px; font-size:10px; font-weight:700; color:' + bc + ';';
        offBadge.textContent = '입력일';
      } else {
        offBadge.style.cssText = 'flex:0 0 60px; font-size:10px; font-weight:700; color:' + offsetLabelColor(tpl.offset, tpl.base) + ';';
        offBadge.textContent = offsetLabel(tpl.offset, tpl.base);
      }
      row.appendChild(offBadge);

      const dateCell = document.createElement('span');
      if(d){
        const isPast = d < today;
        dateCell.style.cssText = 'flex:0 0 96px; color:' + (isPast ? '#bbb' : '#444') + ';';
        dateCell.textContent = formatDateShort(d);
      } else {
        dateCell.style.cssText = 'flex:0 0 96px; color:#c08a2a; font-size:11px;';
        dateCell.textContent = '오픈일 필요';
      }
      row.appendChild(dateCell);

      const cat = isDateEvent ? entry.ev.category : tpl.category;
      const typeCell = document.createElement('span');
      typeCell.style.cssText = 'flex:0 0 72px;';
      if(isDateEvent || tpl.type === 'event'){
        const c = getCategoryColor(cat);
        typeCell.innerHTML = '<span style="font-size:9px; padding:1px 6px; border-radius:20px; background:' + c + '22; border:1px solid ' + c + '55; color:' + c + ';">' + escapeHtml(cat || '일정') + '</span>';
      } else {
        typeCell.innerHTML = '<span style="font-size:9px; color:#999;">할 일</span>';
      }
      row.appendChild(typeCell);

      const nameCell = document.createElement('span');
      nameCell.style.cssText = 'flex:1 1 auto; word-break:break-all;';
      nameCell.innerHTML = escapeHtml(itemName) +
        (!isDateEvent && tpl.tag ? ' <span style="font-size:9px; padding:1px 5px; border-radius:4px; background:#eef2ff; color:#4a5fb5;">#' + escapeHtml(tpl.tag) + '</span>' : '') +
        (dup ? ' <span style="font-size:9px; color:#c08a2a;">이미 있음 (' + escapeHtml(formatDateShort(dup)) + ')</span>' : '');
      row.appendChild(nameCell);

      table.appendChild(row);
    });
    previewWrap.appendChild(table);

    if(missingTotal > 0){
      const parts = BASE_TYPES.filter(bt => missingByBase[bt.id])
        .map(bt => bt.dateLabel + ' ' + missingByBase[bt.id] + '개');
      const w = document.createElement('div');
      w.style.cssText = 'font-size:11px; color:#a9761f; margin-top:8px; background:#fdf6e8; border:1px solid #f0e0b8; border-radius:8px; padding:8px 10px;';
      w.textContent = '기준일이 비어 있어서 만들 수 없는 항목: ' + parts.join(', ') + '. 위에서 해당 날짜를 입력해 주세요.';
      previewWrap.appendChild(w);
    }

    toggleAll.onclick = (e) => {
      e.preventDefault();
      const anyOff = boxes.some(b => !b.checked);
      boxes.forEach(b => { b.checked = anyOff; b.onchange(); });
    };

    const note = document.createElement('div');
    note.style.cssText = 'font-size:11px; color:#999; margin-top:8px; line-height:1.6;';
    note.textContent = '이미 같은 이름으로 만들어 둔 항목은 자동으로 체크가 풀려 있어요. 날짜만 등록하고 업무는 나중에 만들어도 돼요.';
    previewWrap.appendChild(note);

    const act = document.createElement('div');
    act.style.cssText = 'display:flex; gap:8px; justify-content:flex-end; margin-top:14px;';
    const saveOnlyBtn = document.createElement('button');
    saveOnlyBtn.textContent = '날짜만 저장';
    saveOnlyBtn.onclick = () => {
      setShowDateEntry(name, dateLists, tplSelect.value);
      saveShowDates();
      renderShowDateList();
      renderAll();
      setStatus('기준일 저장됨');
    };
    const genBtn = document.createElement('button');
    genBtn.className = 'primary';
    genBtn.textContent = '날짜 저장 + 선택 항목 만들기';
    genBtn.onclick = () => runGenerate(name, baseDates, sorted, genBtn);
    act.appendChild(saveOnlyBtn);
    act.appendChild(genBtn);
    previewWrap.appendChild(act);
  }

  // 같은 콘서트에 같은 제목으로 이미 만들어진 항목이 있으면 그 날짜를 돌려줌
  function findExistingGenerated(projName, text){
    const target = String(text).trim();
    for(const g of data){
      for(const p of g.projects){
        if(p.name !== projName) continue;
        for(const t of p.tasks){
          if(String(t.text || '').trim() === target) return g.date;
        }
      }
    }
    return '';
  }

  function entryKey(e){
    return e.ev
      ? ('evt@' + e.ev.baseId + '@' + e.ev.iso + '@' + e.ev.text)
      : (e.tpl.name + '@' + (e.tpl.base || 'show') + e.tpl.offset);
  }

  async function runGenerate(name, baseDates, sorted, btn){
    const picked = sorted.filter(e => e.date && checkState[entryKey(e)]);
    if(picked.length === 0){
      if(!confirm('선택한 항목이 없어요. 날짜만 저장할까요?')) return;
      setShowDateEntry(name, dateLists, tplSelect.value);
      await saveShowDates();
      renderShowDateList();
      renderAll();
      return;
    }
    const dateLines = BASE_TYPES.filter(bt => (dateLists[bt.id] || []).some(x => x.date))
      .map(bt => {
        const ds = (dateLists[bt.id] || []).filter(x => x.date).map(x => x.date).sort();
        const shown = ds.map(iso => formatDateShort(fromISODate(iso))).join(', ');
        return bt.dateLabel + ' ' + shown + (ds.length > 1 ? '  (기준: ' + formatDateShort(fromISODate(ds[0])) + ')' : '');
      });
    if(!confirm('"' + name + '"\n' + dateLines.join('\n') + '\n\n위 날짜를 저장하고 ' + picked.length + '개 항목을 만들까요?')) return;

    btn.disabled = true;
    const ownerVal = ownerSelect.value || '';
    setShowDateEntry(name, dateLists, tplSelect.value);
    await saveShowDates();

    for(let i = 0; i < picked.length; i++){
      const entry = picked[i];
      const tpl = entry.tpl;
      btn.textContent = '만드는 중... (' + (i+1) + '/' + picked.length + ')';
      setStatus('만드는 중 ' + (i+1) + '/' + picked.length);
      const d = entry.date;
      const dateLabel = formatDateLabel(d);
      const isEvent = entry.ev ? true : (tpl.type === 'event');
      const body = {
        date: dateLabel,
        project: name,
        text: entry.ev ? entry.ev.text : tpl.name,
        assignee: '',
        deadline: '',
        done: false,
        details: '',
        owner: ownerVal,
        category: entry.ev ? entry.ev.category : (isEvent ? (tpl.category || '기타') : ''),
        endDate: isEvent ? dateLabel : '',
        endTime: '',
        allDay: isEvent ? true : false,
        tag: entry.ev ? '' : (tpl.tag || '')
      };
      let targetGroup = data.find(g => g.date === dateLabel);
      if(!targetGroup){
        targetGroup = { date: dateLabel, projects: [] };
        data.push(targetGroup);
        sortDataByDate();
      }
      let targetProj = targetGroup.projects.find(p => p.name === name);
      if(!targetProj){
        targetProj = { name: name, tasks: [] };
        targetGroup.projects.push(targetProj);
      }
      const newTask = Object.assign({ id: 'temp_' + Date.now() + '_' + i }, body);
      targetProj.tasks.push(newTask);
      try {
        const r = await apiAdd(body);
        if(r && r.id) newTask.id = r.id;
      } catch(e){ /* 네트워크 오류는 건너뜀 */ }
    }
    setStatus('동기화됨');
    btn.disabled = false;
    btn.textContent = '날짜 저장 + 선택 항목 만들기';
    Object.keys(checkState).forEach(k => delete checkState[k]);
    renderShowDateList();
    renderPreview();
    renderAll();
    alert(picked.length + '개 항목을 만들었어요.');
  }

  /* ---------- 탭 2 : 템플릿 편집 ---------- */
  function renderTplPane(){
    ensureWorkingSets();
    paneTpl.innerHTML = '';
    const desc = document.createElement('div');
    desc.style.cssText = 'font-size:12px; color:#666; line-height:1.7; margin-bottom:12px;';
    desc.innerHTML = '공연일을 기준으로 며칠 전/후에 해야 하는 일을 적어 두면, 공연일만 입력해도 날짜가 자동으로 계산돼요.<br>' +
      '<span style="color:#999;">기준을 <b>오픈공지 · 티켓오픈 · 공연일</b> 중에 고르고, 기한에 그 날로부터의 일수를 적어요. -30 = 30일 전, 0 = 당일, 3 = 3일 후.<br>예매처별로 템플릿을 따로 만들어 쓸 수 있고, 회사 전체가 같이 씁니다.</span>';
    paneTpl.appendChild(desc);

    // --- 템플릿(예매처) 선택 줄 ---
    const setBar = document.createElement('div');
    setBar.style.cssText = 'display:flex; gap:6px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid #efeee9;';
    const setField = document.createElement('div');
    setField.style.cssText = 'flex:1 1 200px;';
    setField.innerHTML = '<span class="modal-label">예매처 템플릿</span>';
    const setSelect = document.createElement('select');
    setSelect.className = 'modal-input';
    setField.appendChild(setSelect);
    setBar.appendChild(setField);

    const mkBtn = (txt, title, fn, color) => {
      const b = document.createElement('button');
      b.textContent = txt;
      if(title) b.title = title;
      b.style.cssText = 'font-size:12px; padding:8px 11px; height:auto;' + (color ? ' color:' + color + ';' : '');
      b.onclick = fn;
      return b;
    };

    function fillSetSelect(selectId){
      setSelect.innerHTML = '';
      workingSets.forEach(st => {
        const o = document.createElement('option');
        o.value = st.id;
        o.textContent = st.name + ' (' + (st.items ? st.items.length : 0) + ')';
        setSelect.appendChild(o);
      });
      if(selectId && workingSets.some(st => st.id === selectId)) setSelect.value = selectId;
      else if(workingSets.length) setSelect.value = workingSets[0].id;
    }

    function currentSet(){
      return workingSets.find(st => st.id === setSelect.value) || null;
    }

    setBar.appendChild(mkBtn('+ 새 템플릿', '빈 템플릿을 새로 만들어요', (e) => {
      openInlineTextInput(e.target.getBoundingClientRect(), '예매처 이름 (예: 인터파크)', (val) => {
        const nm = (val || '').trim();
        if(!nm) return;
        const st = { id: newTemplateId(), name: nm, items: [] };
        workingSets.push(st);
        fillSetSelect(st.id);
        drawRows();
      });
    }));
    setBar.appendChild(mkBtn('복제', '지금 템플릿을 그대로 복사해서 새 예매처용으로 만들어요', (e) => {
      const cur = currentSet();
      if(!cur) return;
      openInlineTextInput(e.target.getBoundingClientRect(), '새 이름 (예: 예스24)', (val) => {
        const nm = (val || '').trim();
        if(!nm) return;
        const st = { id: newTemplateId(), name: nm, items: (cur.items || []).map(i => Object.assign({}, i)) };
        workingSets.push(st);
        fillSetSelect(st.id);
        drawRows();
      });
    }));
    setBar.appendChild(mkBtn('이름 변경', '', (e) => {
      const cur = currentSet();
      if(!cur) return;
      openInlineTextInput(e.target.getBoundingClientRect(), '예매처 이름', (val) => {
        const nm = (val || '').trim();
        if(!nm) return;
        cur.name = nm;
        fillSetSelect(cur.id);
      }, cur.name);
    }));
    setBar.appendChild(mkBtn('삭제', '', () => {
      const cur = currentSet();
      if(!cur) return;
      if(workingSets.length <= 1){ alert('템플릿이 하나뿐이라 지울 수 없어요.'); return; }
      if(!confirm('"' + cur.name + '" 템플릿을 지울까요?\n(이미 만들어진 할 일은 그대로 남아요)')) return;
      workingSets = workingSets.filter(st => st.id !== cur.id);
      fillSetSelect('');
      drawRows();
    }, '#c0392b'));
    paneTpl.appendChild(setBar);

    const head = document.createElement('div');
    head.style.cssText = 'display:flex; gap:8px; font-size:10px; color:#999; padding:0 4px 6px; font-weight:600;';
    head.innerHTML = '<span style="flex:0 0 104px;">기준</span>' +
      '<span style="flex:0 0 60px;">기한</span>' +
      '<span style="flex:1 1 auto;">업무명</span>' +
      '<span style="flex:0 0 72px;">구분</span>' +
      '<span style="flex:0 0 92px;">카테고리</span>' +
      '<span style="flex:0 0 84px;">태그</span>' +
      '<span style="flex:0 0 30px;"></span>';
    paneTpl.appendChild(head);

    const rowsWrap = document.createElement('div');
    rowsWrap.style.cssText = 'max-height:340px; overflow-y:auto; border:1px solid #e8e6e0; border-radius:10px;';
    paneTpl.appendChild(rowsWrap);

    function drawRows(){
      rowsWrap.innerHTML = '';
      const set = currentSet();
      const working = set ? set.items : [];
      // 새로 추가한(아직 저장 안 한) 항목은 찾기 쉽게 맨 아래에 고정
      working.sort((a,b) => {
        if(a._new && !b._new) return 1;
        if(b._new && !a._new) return -1;
        return (baseRankOf(a) - baseRankOf(b)) || ((a.offset||0) - (b.offset||0));
      });
      working.forEach((tpl, idx) => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; gap:8px; align-items:center; padding:6px 8px;' +
          (tpl._new ? 'background:#fffbe8;' : (idx % 2 ? 'background:#faf9f6;' : ''));

        const baseI = document.createElement('select');
        baseI.className = 'modal-input';
        baseI.style.cssText = 'flex:0 0 104px; padding:5px 5px; font-size:12px;';
        BASE_TYPES.forEach(bt => {
          const o = document.createElement('option');
          o.value = bt.id; o.textContent = bt.label;
          if((tpl.base||'show') === bt.id) o.selected = true;
          baseI.appendChild(o);
        });
        baseI.style.color = baseType(tpl.base).id === 'show' ? '' : baseType(tpl.base).color;
        baseI.onchange = () => { tpl.base = baseI.value; drawRows(); };
        row.appendChild(baseI);

        const off = document.createElement('input');
        off.type = 'number';
        off.className = 'modal-input';
        off.style.cssText = 'flex:0 0 60px; padding:5px 7px; font-size:12px; color:' + offsetLabelColor(tpl.offset, tpl.base) + '; font-weight:600;';
        off.value = tpl.offset || 0;
        off.title = offsetLabel(tpl.offset, tpl.base);
        off.onchange = () => { tpl.offset = parseInt(off.value, 10) || 0; drawRows(); };
        row.appendChild(off);

        const nameI = document.createElement('input');
        nameI.type = 'text';
        nameI.className = 'modal-input';
        nameI.style.cssText = 'flex:1 1 auto; padding:5px 7px; font-size:12px;';
        nameI.dataset.role = 'tplName';
        nameI.value = tpl.name || '';
        nameI.onchange = () => { tpl.name = nameI.value; };
        row.appendChild(nameI);

        const typeI = document.createElement('select');
        typeI.className = 'modal-input';
        typeI.style.cssText = 'flex:0 0 72px; padding:5px 5px; font-size:12px;';
        [['task','할 일'],['event','일정']].forEach(([v,l]) => {
          const o = document.createElement('option');
          o.value = v; o.textContent = l;
          if((tpl.type||'task') === v) o.selected = true;
          typeI.appendChild(o);
        });
        row.appendChild(typeI);

        const catI = document.createElement('select');
        catI.className = 'modal-input';
        catI.style.cssText = 'flex:0 0 92px; padding:5px 5px; font-size:12px;';
        EVENT_CATEGORIES.forEach(c => {
          const o = document.createElement('option');
          o.value = c.name; o.textContent = c.name;
          if(tpl.category === c.name) o.selected = true;
          catI.appendChild(o);
        });
        catI.onchange = () => { tpl.category = catI.value; };
        row.appendChild(catI);

        function syncType(){
          tpl.type = typeI.value;
          const isEv = typeI.value === 'event';
          catI.disabled = !isEv;
          catI.style.opacity = isEv ? '1' : '0.35';
          if(isEv && !tpl.category){ tpl.category = catI.value; }
          if(!isEv){ tpl.category = ''; }
        }
        typeI.onchange = syncType;
        syncType();

        const tagI = document.createElement('input');
        tagI.type = 'text';
        tagI.className = 'modal-input';
        tagI.style.cssText = 'flex:0 0 84px; padding:5px 5px; font-size:12px;';
        tagI.placeholder = '예: 도면작업';
        tagI.value = tpl.tag || '';
        tagI.onchange = () => { tpl.tag = tagI.value.trim(); };
        row.appendChild(tagI);

        const del = document.createElement('button');
        del.textContent = '✕';
        del.title = '이 항목 삭제';
        del.style.cssText = 'flex:0 0 30px; font-size:12px; padding:4px 0; height:auto; color:#c0392b;';
        del.onclick = () => { working.splice(idx, 1); drawRows(); };
        row.appendChild(del);

        rowsWrap.appendChild(row);
      });
      if(working.length === 0){
        const p = document.createElement('div');
        p.style.cssText = 'font-size:12px; color:#999; padding:14px;';
        p.textContent = '항목이 없어요. 아래 "+ 항목 추가"를 눌러 주세요.';
        rowsWrap.appendChild(p);
      }
    }
    setSelect.addEventListener('change', drawRows);
    fillSetSelect(lastEditedSetId);
    drawRows();

    const act = document.createElement('div');
    act.style.cssText = 'display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;';
    const addBtn = document.createElement('button');
    addBtn.textContent = '+ 항목 추가';
    addBtn.onclick = () => {
      const set = currentSet();
      if(!set) return;
      set.items.push({ name:'', base:'show', offset:-7, type:'task', category:'', tag:'', _new: true });
      drawRows();
      rowsWrap.scrollTop = rowsWrap.scrollHeight;
      const nameInputs = rowsWrap.querySelectorAll('[data-role="tplName"]');
      if(nameInputs.length) nameInputs[nameInputs.length - 1].focus();

/* 버튼 아래에 뜨는 패널이 화면 밖으로 잘리지 않게 위치를 잡아 줌.
   아래 공간이 부족하면 버튼 위쪽으로 띄우고, 그래도 모자라면 높이를 화면에 맞춤 */
function positionPanelNearAnchor(panel, rect){
  const MARGIN = 10;
  const GAP = 4;
  const vh = window.innerHeight;
  // 버튼이 화면 밖으로 조금 나가 있어도 계산이 깨지지 않도록 범위를 잘라 줌
  const aTop = Math.max(0, Math.min(rect.top, vh));
  const aBottom = Math.max(0, Math.min(rect.bottom, vh));
  const spaceBelow = vh - aBottom - GAP - MARGIN;
  const spaceAbove = aTop - GAP - MARGIN;

  panel.style.bottom = 'auto';
  panel.style.maxHeight = 'none';
  const needed = panel.scrollHeight + 2;

  // 아래가 좁고 위가 더 넓으면 버튼 위쪽으로 띄움
  const placeBelow = (needed <= spaceBelow) || (spaceBelow >= spaceAbove);
  const avail = Math.max(120, placeBelow ? spaceBelow : spaceAbove);
  const h = Math.min(needed, avail);
  panel.style.maxHeight = h + 'px';

  let top = placeBelow ? (aBottom + GAP) : (aTop - GAP - h);
  top = Math.max(MARGIN, Math.min(top, vh - h - MARGIN));
  panel.style.top = top + 'px';
  panel.style.overflowY = 'auto';
}

/* 담당자 이름 문자열을 사람 이름 배열로 쪼갬.
   쉼표(, ，、), 가운뎃점(·), 슬래시, & 를 모두 구분자로 봄 */
function splitOwnerNames(o){
  return String(o || '')
    .replace(/[\u200B-\u200D\uFEFF]/g, '')          // 보이지 않는 문자 제거
    .replace(/[\u00A0\u3000]/g, ' ')                 // 특수 공백 → 일반 공백
    .replace(/^\s*\[[^\]]*\]\s*/, '')              // 앞에 붙은 "[1팀] " 같은 표시 제거
    .split(/[,\uFF0C\u3001\u00B7\/&]/)
    .map(x => x.trim().replace(/\s+/g, ' '))
    .filter(Boolean);
}

/* 비교·저장용 표준 형태.
   "박찬희,서주현", "박찬희 , 서주현", "박찬희，서주현", "[1팀] 박찬희, 서주현"
   → 모두 "박찬희, 서주현" */
function normalizeOwnerString(o){
  return splitOwnerNames(o).join(', ');
}

/* 중복 판정용 키 — 이름 순서가 달라도 같은 사람들이면 같은 키.
   "서주현, 박찬희" 와 "박찬희, 서주현" 을 같은 조합으로 봄 */
function ownerIdentityKey(o){
  return splitOwnerNames(o).slice().sort((a,b) => a.localeCompare(b,'ko')).join('\u0001');
}

/* 같은 사람(들)을 가리키는데 글자만 다른 담당자 이름들을 묶어서 돌려줌.
   대표 이름은 실제로 가장 많이 쓰인 표기를 고름 */
function findDuplicateOwnerGroups(){
  const groups = {};
  getKnownOwners().forEach(n => {
    const key = ownerIdentityKey(n);
    if(!key) return;
    if(!groups[key]) groups[key] = [];
    groups[key].push(n);
  });
  return Object.keys(groups)
    .filter(k => {
      const vs = groups[k];
      if(vs.length > 1) return true;
      // 혼자여도 표기가 지저분하면(예: "[1팀] 박찬희") 정리 대상
      return vs[0] !== normalizeOwnerString(vs[0]);
    })
    .map(k => {
      const vs = groups[k].slice();
      let best = vs[0], bestCount = -1;
      vs.forEach(v => {
        const c = countOwnerUsage(v);
        if(c > bestCount){ bestCount = c; best = v; }
      });
      return {
        canonical: normalizeOwnerString(best),
        variants: vs,
        counts: vs.map(v => countOwnerUsage(v))
      };
    });
}

function mergeDuplicateOwners(){
  const groups = findDuplicateOwnerGroups();
  if(groups.length === 0){
    alert('똑같은 담당자 이름이 중복된 건 없어요.');
    return false;
  }
  const lines = groups.map(g => {
    const from = g.variants.map((v, i) => v + '(' + g.counts[i] + '개)').join('  +  ');
    return '· ' + from + '\n   →  ' + g.canonical;
  });
  const ok = confirm('아래 담당자를 하나로 합칠까요?\n\n' + lines.join('\n\n') +
    '\n\n할 일에 적힌 담당자도 함께 바뀝니다.');
  if(!ok) return false;

  groups.forEach(g => {
    // 소속팀이 지정된 이름이 하나라도 있으면 그 팀을 유지
    let team = '';
    g.variants.forEach(v => { if(!team && ownerTeams[v]) team = ownerTeams[v]; });
    g.variants.forEach(v => { if(v !== g.canonical) renameOwnerGlobally(v, g.canonical); });
    if(team && !ownerTeams[g.canonical]){
      ownerTeams[g.canonical] = team;
      saveOwnerTeams();
    }
  });
  renderAll();
  return true;
}

  }

  const tags = getKnownTaskTags();
  if(tags.length > 0){

    tags.forEach(tag => {

  requestAnimationFrame(() => {

  });

function openInlineTextInput(rect, placeholder, onConfirm, initialValue){
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = placeholder;
  if(initialValue) input.value = initialValue;
  // 모달(z-index 2000) 위에 떠야 하므로 더 높게
  input.style.cssText = 'position:fixed; top:' + (rect.bottom + 4) + 'px; left:' + rect.left + 'px; z-index:3000; font-size:14px; padding:6px 8px; border:1px solid #2563eb; border-radius:6px; width:180px;';
  document.body.appendChild(input);

  let handled = false;
  const cleanup = () => {
    document.removeEventListener('mousedown', outsideClickHandler, true);
    if(input.parentNode) input.parentNode.removeChild(input);
  };
  const confirm = () => {
    if(handled) return;
    handled = true;
    const val = input.value;
    cleanup();
    onConfirm(val);
  };
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ confirm(); }
    else if(e.key === 'Escape'){ handled = true; cleanup(); }
  });
  input.addEventListener('blur', () => { setTimeout(() => { if(!handled) confirm(); }, 150); });

  const outsideClickHandler = (e) => {
    if(e.target !== input){ if(!handled) confirm(); }
  };
  setTimeout(() => { document.addEventListener('mousedown', outsideClickHandler, true); }, 0);

  requestAnimationFrame(() => { input.focus(); input.select(); });
}

        textInput.className = 'task-text' + (task.done ? ' done' : '');
        renderTabs();
        renderProgress();
        updateWeeklyTaskLine(task);
        await apiUpdate({ id: task.id, done: task.done });
      };

      const textInput = document.createElement('input');
      textInput.type = 'text';
      textInput.value = task.text;
      textInput.placeholder = '할 일 내용';
      textInput.className = 'task-text' + (task.done ? ' done' : '');
      textInput.oninput = () => { task.text = textInput.value; };
      textInput.onblur = async () => { renderAll(); await apiUpdate({ id: task.id, text: task.text }); };

      const detailsInput = document.createElement('textarea');
      detailsInput.className = 'task-details';
      detailsInput.value = task.details || '';
      detailsInput.placeholder = '';
      detailsInput.rows = 1;
      detailsInput.style.cssText = 'flex:1 1 100%; width:calc(100% - 24px); margin-left:24px; font-size:12.5px; line-height:1.55; color:#4a4a4a; border:none; border-left:2px solid ' + accentColor + '55; border-radius:0; padding:2px 0 2px 8px; margin-top:2px; resize:none; overflow:hidden; font-family:inherit; box-sizing:border-box; background:transparent;';
      const autoGrowDetails = () => {
        detailsInput.style.height = 'auto';
        detailsInput.style.height = Math.max(36, detailsInput.scrollHeight) + 'px';
      };
      detailsInput.oninput = () => { task.details = detailsInput.value; autoGrowDetails(); };
      detailsInput.onblur = async () => { await apiUpdate({ id: task.id, details: task.details }); };
      requestAnimationFrame(autoGrowDetails);

      const tagBtn = document.createElement('button');
      tagBtn.className = 'del-btn';
      tagBtn.textContent = task.tag ? task.tag : '#';
      tagBtn.title = '업무 태그 (예: 도면작업)';
      const tagColor = task.tag ? ownerColorFor(task.tag) : '#bbbbbb';
      tagBtn.style.cssText = 'flex-shrink:0; font-size:10px; padding:4px 8px; height:30px; border-radius:20px; background:' + tagColor + '22; border:1px solid ' + tagColor + '55; color:' + tagColor + ';';
      tagBtn.onclick = () => {
        openTaskTagPicker(tagBtn, task.tag || '', (newTag) => {
          task.tag = newTag;
          renderAll();
          apiUpdate({ id: task.id, tag: newTag });
        });
      };

      const moveBtn = document.createElement('button');
      moveBtn.className = 'del-btn';
      moveBtn.textContent = '→';
      moveBtn.title = '다른 날짜로 이동';
      let activeMovePickerCleanup = null;
      moveBtn.onclick = () => {
        if(activeMovePickerCleanup){
          activeMovePickerCleanup();
          activeMovePickerCleanup = null;
          return;
        }
        const rect = moveBtn.getBoundingClientRect();
        const picker = document.createElement('input');
        picker.type = 'date';
        picker.value = toISODate(parseDateLabel(dateGroup.date));
        picker.style.cssText = 'position:fixed; top:' + (rect.bottom + 4) + 'px; left:' + rect.left + 'px; z-index:999; font-size:14px; padding:4px 6px; border:1px solid #2563eb; border-radius:6px;';
        document.body.appendChild(picker);

        let handled = false;
        let outsideClickHandler = null;

        const cleanup = () => {
          if(outsideClickHandler){
            document.removeEventListener('mousedown', outsideClickHandler, true);
            document.removeEventListener('touchstart', outsideClickHandler, true);
            outsideClickHandler = null;
          }
          if(picker.parentNode) picker.parentNode.removeChild(picker);
          activeMovePickerCleanup = null;
        };
        activeMovePickerCleanup = cleanup;

        const handleChange = () => {
          if(handled) return;
          handled = true;
          if(picker.value){
            const newDate = formatDateLabel(fromISODate(picker.value));
            if(newDate !== dateGroup.date){
              proj.tasks.splice(ti,1);
              if(proj.tasks.length === 0){
                const projIdx = dateGroup.projects.indexOf(proj);
                if(projIdx > -1) dateGroup.projects.splice(projIdx, 1);
              }

              let targetGroup = data.find(g => g.date === newDate);
              if(!targetGroup){
                targetGroup = { date: newDate, projects: [] };
                data.push(targetGroup);
              }
              let targetProj = targetGroup.projects.find(p => p.name === proj.name);
              if(!targetProj){
                targetProj = { name: proj.name, tasks: [] };
                targetGroup.projects.push(targetProj);
              }
              task.date = newDate;
              targetProj.tasks.push(task);

              sortDataByDate();
              renderAll();
              setStatus('이동 중...');
              apiUpdate({ id: task.id, date: newDate }).then(() => setStatus('동기화됨'));
            }
          }
          cleanup();
        };

        picker.addEventListener('change', handleChange);
        picker.addEventListener('blur', () => { setTimeout(() => { if(!handled) cleanup(); }, 250); });

        outsideClickHandler = (e) => {
          if(e.target !== picker){
            if(!handled) cleanup();
          }
        };
        setTimeout(() => {
          document.addEventListener('mousedown', outsideClickHandler, true);
          document.addEventListener('touchstart', outsideClickHandler, true);
        }, 0);

        requestAnimationFrame(() => {
          try { if(picker.showPicker){ picker.showPicker(); } else { picker.focus(); } }
          catch(e){ picker.focus(); }
        });
      };

      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.textContent = '✕';
      delBtn.onclick = async () => {
        proj.tasks.splice(ti,1);
        renderAll();
        await apiDelete(task.id);
      };

      row.appendChild(check);
      row.appendChild(textInput);
      row.appendChild(tagBtn);
      row.appendChild(moveBtn);
      row.appendChild(delBtn);
      row.appendChild(detailsInput);
      projWrap.appendChild(row);
    });

    projGrid.appendChild(projWrap);
  });
}

function renderRight(){
  const right = document.getElementById('rightPanel');
  if(!right) return;
  right.innerHTML = '';
  const dateGroup = data[activeIdx];

  const titleRow = document.createElement('div');
  titleRow.className = 'right-title';
  titleRow.innerHTML = '<span>' + (dateGroup ? formatDateShort(dateGroup.date) + ' 타임박스' : '타임박스') + '</span><span style="color:#aaa;">블록을 드래그해서 옮기세요</span>';
  right.appendChild(titleRow);

  if(!dateGroup) return;

  const gridWrap = document.createElement('div');
  gridWrap.className = 'grid-wrap';

  const totalH = (HOUR_END - HOUR_START + 1) * HOUR_H;
  const hoursCol = document.createElement('div');
  hoursCol.className = 'hours-col';
  hoursCol.style.height = totalH + 'px';

  for(let h = HOUR_START; h <= HOUR_END; h++){
    const lineY = (h - HOUR_START) * HOUR_H;
    const hourLabel = document.createElement('div');
    hourLabel.className = 'hour-label';
    hourLabel.style.top = lineY + 'px';
    hourLabel.textContent = String(h).padStart(2,'0') + ':00';
    hoursCol.appendChild(hourLabel);
    const line = document.createElement('div');
    line.className = 'hour-line';
    line.style.top = lineY + 'px';
    hoursCol.appendChild(line);

  if(h < HOUR_END){
      for(let mm = 10; mm < 60; mm += 10){
        const minorY = lineY + (mm / 60 * HOUR_H);
        const minorLine = document.createElement('div');
        minorLine.style.position = 'absolute';
        minorLine.style.top = minorY + 'px';
        minorLine.style.left = '52px';
        minorLine.style.right = '0';
        minorLine.style.borderTop = (mm === 30) ? '1px dashed #ddd' : '1px dotted #ececec';
        hoursCol.appendChild(minorLine);

        if(mm === 30){
          const minorLabel = document.createElement('div');
          minorLabel.className = 'hour-label';
          minorLabel.style.top = minorY + 'px';
          minorLabel.style.fontSize = '10px';
          minorLabel.style.color = '#bbb';
          minorLabel.textContent = String(h).padStart(2,'0') + ':30';
          hoursCol.appendChild(minorLabel);
        }
      }
    }
  }

  const now = new Date();
  const todayKey = todaySortKey();
  if(dateSortKey(dateGroup.date) === todayKey){
    const nowMin = now.getHours() * 60 + now.getMinutes();
    if(nowMin >= HOUR_START * 60 && nowMin <= HOUR_END * 60 + 60){
      const nowY = (nowMin - HOUR_START * 60) / 60 * HOUR_H;
      const nowLine = document.createElement('div');
      nowLine.style.cssText = 'position:absolute; top:' + nowY + 'px; left:52px; right:0; height:3px; background:#e63946; z-index:5; border-radius:2px; box-shadow:0 0 4px rgba(230,57,70,0.5);';
      hoursCol.appendChild(nowLine);
      const nowDot = document.createElement('div');
      nowDot.style.cssText = 'position:absolute; top:' + (nowY - 4) + 'px; left:46px; width:11px; height:11px; border-radius:50%; background:#e63946; z-index:5;';
      hoursCol.appendChild(nowDot);
    }
  }

  let items = [];
  getVisibleProjects(dateGroup).forEach(proj => {
    proj.tasks.forEach(task => {
      const mins = timeToMinutes(task.deadline);
      if(mins !== null){
        items.push({ task: task, proj: proj.name, mins: mins });
      }
    });
  });

  const startMin = HOUR_START * 60;
  const endMin = HOUR_END * 60 + 60;

  items.sort((a,b) => a.mins - b.mins);

  // 가까운 시간대 항목끼리 클러스터로 묶기 (블록 높이만큼 간격이 안 나오면 같은 클러스터)
  const minGapMin = (BLOCK_H + BLOCK_GAP) / HOUR_H * 60;
  let clusters = [];
  items.forEach(item => {
    if(item.mins < startMin || item.mins > endMin) return;
    const last = clusters[clusters.length - 1];
    if(last && (item.mins - last.anchorMins) < minGapMin){
      last.items.push(item);
    } else {
      clusters.push({ anchorMins: item.mins, items: [item] });
    }
  });

  clusters.forEach(cluster => {
    const top = (cluster.anchorMins - startMin) / 60 * HOUR_H;
    const n = cluster.items.length;
    cluster.items.forEach((item, colIdx) => {
      const accentColor = colorFor(item.proj);
      const block = document.createElement('div');
      block.className = 'task-block';
      block.style.position = 'absolute';
      block.style.top = top + 'px';
      block.style.height = BLOCK_H + 'px';
      block.style.left = 'calc(58px + (100% - 64px) * ' + (colIdx / n) + ')';
      block.style.width = 'calc((100% - 64px) / ' + n + ' - 4px)';
      block.style.right = 'auto';
      block.style.overflow = 'hidden';
      const isPastEvent = !!(item.task.category && isEventPast(item.task, selectedDate));
      const showAsDone = item.task.done || isPastEvent;
      if(showAsDone){
        block.style.background = '#cfcfcf';
        block.style.borderLeft = '3px solid #8a8a8a';
        block.style.opacity = '1';
      } else {
        block.style.background = accentColor + '2a';
        block.style.borderLeft = '3px solid ' + accentColor;
      }
      const parsedMin = timeToMinutes(item.task.deadline);
      const cleanDeadline = parsedMin !== null ? minutesToTimeStr(parsedMin) : item.task.deadline;
      block.innerHTML = '<div class="task-block-sub block-time" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; color:inherit;">' + item.proj + ' · ' + cleanDeadline + '</div><div class="task-block-title" style="white-space:normal; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; font-weight:400; margin-top:2px;' + (showAsDone ? ' text-decoration:line-through;' : '') + '">' + (item.task.text || '(내용 없음)') + '</div>';

    let dragging = false;
    let startY = 0;
    let startTop = 0;

    block.addEventListener('pointerdown', (e) => {
      dragging = true;
      startY = e.clientY;
      startTop = parseFloat(block.style.top);
      block.style.cursor = 'grabbing';
      block.style.zIndex = '10';
      block.setPointerCapture(e.pointerId);
    });

    block.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      let newTop = startTop + (e.clientY - startY);
      newTop = Math.max(0, Math.min(totalH - block.offsetHeight, newTop));
      const rawMin = startMin + (newTop / HOUR_H * 60);
      const snappedMin = Math.round(rawMin / SNAP) * SNAP;
      const snappedTop = (snappedMin - startMin) / 60 * HOUR_H;
      block.style.top = snappedTop + 'px';
      const timeEl = block.querySelector('.block-time');
      if(timeEl) timeEl.textContent = item.proj + ' · ' + minutesToTimeStr(snappedMin);
    });

    block.addEventListener('pointerup', async (e) => {
      if(!dragging) return;
      dragging = false;
      block.style.cursor = 'grab';
      block.style.zIndex = '2';
      const finalTop = parseFloat(block.style.top);
      const finalMin = startMin + (finalTop / HOUR_H * 60);
      item.task.deadline = minutesToTimeStr(finalMin);
      renderAll();
      await apiUpdate({ id: item.task.id, deadline: item.task.deadline });
    });

    hoursCol.appendChild(block);
    });
  });

  gridWrap.appendChild(hoursCol);
  right.appendChild(gridWrap);

  if(items.length === 0){
    const empty = document.createElement('p');
    empty.className = 'empty-note';
    empty.textContent = '왼쪽에서 마감시간을 입력하면 이 그리드에 블록으로 표시돼요. 블록은 드래그해서 옮길 수 있어요.';
    right.appendChild(empty);
  }
}

function updateWeeklyTaskLine(task){
  if(!weeklyViewOpen) return;
  const line = document.querySelector('.weekly-task-line[data-task-id="' + task.id + '"]');
  if(!line) return;
  if(task.done){
    line.style.textDecoration = 'line-through';
    line.style.opacity = '0.55';
  } else {
    line.style.textDecoration = 'none';

function renderProgress(){
  const wrap = document.getElementById('progressBar');
  const dateGroup = data[activeIdx];
  if(!dateGroup){ wrap.innerHTML = ''; return; }

  let total = 0;
  let done = 0;
  getVisibleProjects(dateGroup).forEach(proj => {
    proj.tasks.forEach(task => {
      if(task.category) return;
      total++;
      if(task.done) done++;
    });
  });

  if(total === 0){ wrap.innerHTML = ''; return; }

  const pct = Math.round((done / total) * 100);
  wrap.innerHTML =
    '<div class="progress-wrap">' +
      '<span class="progress-text">' + formatDateShort(dateGroup.date) + ' 완료 ' + done + ' / ' + total + '</span>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;"></div></div>' +
      '<span class="progress-pct">' + pct + '%</span>' +
    '</div>';
}

function withScrollLock(fn){
  const scrollX = window.scrollX;
  const scrollY = window.scrollY;
  const prevMinHeight = document.body.style.minHeight;
  document.body.style.minHeight = document.documentElement.scrollHeight + 'px';

  const projGridBefore = document.querySelector('.proj-grid');
  const projGridScrollLeft = projGridBefore ? projGridBefore.scrollLeft : 0;

  fn();

  const restore = () => {
    window.scrollTo(scrollX, scrollY);
    const projGridAfter = document.querySelector('.proj-grid');
    if(projGridAfter && projGridScrollLeft) projGridAfter.scrollLeft = projGridScrollLeft;
  };

  restore();
  requestAnimationFrame(() => {
    restore();
    document.body.style.minHeight = prevMinHeight;
    requestAnimationFrame(restore);
  });
}

let stickyNotes = [];
let stickyNotesTrash = [];
let stickyTrashOpen = false;
let stickyNotesVisible = false;

const STICKY_COLORS = ['#fff6b7', '#ffd9d4', '#d4ecff', '#d9f5d6', '#eadcf7', '#f5f0e6'];

function saveStickyNotes(){
  if(!currentOwner) return;
  allUserNotes[currentOwner] = stickyNotes;
  apiSetSettings({ noteOwner: currentOwner, notes: stickyNotes });
}

function saveStickyTrash(){
  if(!currentOwner) return;
  allUserNotesTrash[currentOwner] = stickyNotesTrash;
  apiSetSettings({ noteOwner: currentOwner, notesTrash: stickyNotesTrash });
}

function applyLoadedNotes(){
  if(!currentOwner) return;
  const mine = allUserNotes[currentOwner];
  stickyNotes = (mine && mine.length > 0) ? mine : [{ html: '', color: STICKY_COLORS[0], title: '' }];
  stickyNotesTrash = allUserNotesTrash[currentOwner] || [];
  renderStickyNotes();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* 제목이 비어 있으면 본문 첫 줄에서 요약을 만들어 보여 줌 */
function stickyAutoLabel(note, idx){
  const txt = String(note.html || '')
    .replace(/<br\s*\/?>/gi, ' ')
    .replace(/<\/(div|p|li)>/gi, ' ')
    .replace(/<[^>]*>/g, '')
    .replace(/&nbsp;/gi, ' ')
    .replace(/&amp;/gi, '&')
    .replace(/&lt;/gi, '<')
    .replace(/&gt;/gi, '>')
    .replace(/\s+/g, ' ')
    .trim();
  if(txt) return txt.length > 20 ? (txt.slice(0, 20) + '…') : txt;
  return '메모 ' + (idx + 1);
}

function moveStickyNote(from, to){
  if(from === to || from < 0 || to < 0) return;
  const moved = stickyNotes.splice(from, 1)[0];
  stickyNotes.splice(to, 0, moved);
  saveStickyNotes();
  renderStickyNotes();
}

function renderStickyNotes(){
  const wrap = document.getElementById('stickyNotesWrap');
  wrap.innerHTML = '';
  wrap.style.display = stickyNotesVisible ? 'flex' : 'none';
  if(!stickyNotesVisible) return;

  let draggedNoteIdx = null;

  stickyNotes.forEach((note, idx) => {
    const collapsed = !!note.collapsed;
    const card = document.createElement('div');
    card.className = 'sticky-note';
    card.style.background = note.color || STICKY_COLORS[0];

    const header = document.createElement('div');
    header.className = 'sticky-note-header';

    // 손잡이를 누르고 있을 때만 카드가 끌리게 해서, 본문 글자 선택을 방해하지 않음
    const dragHandle = document.createElement('span');
    dragHandle.textContent = '⠿';
    dragHandle.title = '끌어서 순서 바꾸기';
    dragHandle.style.cssText = 'cursor:grab; color:#8a7f3d; opacity:0.45; font-size:12px; flex-shrink:0; user-select:none; line-height:1;';
    dragHandle.addEventListener('mousedown', () => { card.draggable = true; });
    dragHandle.addEventListener('mouseup', () => { card.draggable = false; });

    card.addEventListener('dragstart', (e) => {
      draggedNoteIdx = idx;
      card.style.opacity = '0.4';
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', String(idx)); } catch(err){}
      }
    });
    card.addEventListener('dragend', () => {
      card.style.opacity = '1';
      card.draggable = false;
      draggedNoteIdx = null;
      wrap.querySelectorAll('.sticky-note').forEach(c => { c.style.outline = ''; });
    });
    card.addEventListener('dragover', (e) => {
      if(draggedNoteIdx === null || draggedNoteIdx === idx) return;
      e.preventDefault();
      card.style.outline = '2px dashed rgba(138,127,61,0.6)';
      card.style.outlineOffset = '2px';
    });
    card.addEventListener('dragleave', () => { card.style.outline = ''; });
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.style.outline = '';
      if(draggedNoteIdx !== null && draggedNoteIdx !== idx){
        const from = draggedNoteIdx;
        draggedNoteIdx = null;
        moveStickyNote(from, idx);
      }
    });

    const title = document.createElement('input');
    title.type = 'text';
    title.className = 'sticky-note-title-input';
    title.value = note.title || '';
    title.placeholder = stickyAutoLabel(note, idx);
    title.title = '메모 이름 (접었을 때도 보여요)';
    title.maxLength = 40;
    title.onchange = () => {
      stickyNotes[idx].title = title.value.trim();
      saveStickyNotes();
    };
    title.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); title.blur(); }
    });

    const headerBtns = document.createElement('span');
    headerBtns.style.cssText = 'display:flex; gap:2px; align-items:center;';

    const collapseBtn = document.createElement('button');
    collapseBtn.className = 'sticky-note-close';
    collapseBtn.textContent = collapsed ? '▸' : '▾';
    collapseBtn.title = collapsed ? '펼치기' : '접기';
    collapseBtn.onclick = () => {
      stickyNotes[idx].collapsed = !collapsed;
      saveStickyNotes();
      renderStickyNotes();
    };

    const trashBtn = document.createElement('button');
    trashBtn.className = 'sticky-note-close';
    trashBtn.textContent = '✕';
    trashBtn.title = '이 메모 삭제 (휴지통으로 이동)';
    trashBtn.style.cssText += 'color:#c0392b; font-weight:700;';
    trashBtn.onclick = () => {
      stickyNotesTrash.unshift(stickyNotes[idx]);
      if(stickyNotesTrash.length > 20) stickyNotesTrash = stickyNotesTrash.slice(0, 20);
      saveStickyTrash();
      stickyNotes.splice(idx, 1);
      saveStickyNotes();
      renderStickyNotes();
    };

    headerBtns.appendChild(trashBtn);
    headerBtns.appendChild(collapseBtn);
    header.appendChild(dragHandle);
    header.appendChild(title);
    header.appendChild(headerBtns);
    card.appendChild(header);

    if(collapsed){
      wrap.appendChild(card);
      return;
    }

    const body = document.createElement('div');
    body.className = 'sticky-note-body';
    body.contentEditable = 'true';
    body.setAttribute('data-placeholder', '자유롭게 메모하세요');
    body.innerHTML = note.html || '';

    const toolbar = document.createElement('div');
    toolbar.className = 'sticky-toolbar';

    const mkFormatBtn = (label, cmd, style) => {
      const b = document.createElement('button');
      b.innerHTML = label;
      b.title = cmd;
      if(style) b.style.cssText += style;
      b.onmousedown = (e) => { e.preventDefault(); };
      b.onclick = () => {
        body.focus();
        document.execCommand(cmd, false, null);
        stickyNotes[idx].html = body.innerHTML;
        saveStickyNotes();
      };
      return b;
    };
    toolbar.appendChild(mkFormatBtn('<b>B</b>', 'bold'));
    toolbar.appendChild(mkFormatBtn('<i>I</i>', 'italic'));
    toolbar.appendChild(mkFormatBtn('<s>S</s>', 'strikeThrough'));

    const spacer = document.createElement('span');
    spacer.style.cssText = 'flex:1;';
    toolbar.appendChild(spacer);

    STICKY_COLORS.forEach(color => {
      const dot = document.createElement('button');
      dot.className = 'sticky-color-dot';
      dot.style.background = color;
      dot.title = '색상 변경';
      dot.onmousedown = (e) => { e.preventDefault(); };
      dot.onclick = () => {
        stickyNotes[idx].color = color;
        card.style.background = color;
        saveStickyNotes();
      };
      toolbar.appendChild(dot);
    });

    card.appendChild(toolbar);

    let saveTimer = null;
    body.addEventListener('input', () => {
      stickyNotes[idx].html = body.innerHTML;
      // 제목을 따로 안 적었으면 본문 첫 줄이 이름 자리에 보이도록 갱신
      if(!(stickyNotes[idx].title || '').trim()){
        title.placeholder = stickyAutoLabel(stickyNotes[idx], idx);
      }
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveStickyNotes, 400);
    });
    card.appendChild(body);

    wrap.appendChild(card);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'sticky-add-btn';
  addBtn.textContent = '+ 메모 추가';
  addBtn.onclick = () => {
    stickyNotes.push({ html: '', color: STICKY_COLORS[0], title: '' });
    saveStickyNotes();
    renderStickyNotes();
  };
  wrap.appendChild(addBtn);

  const trashToggle = document.createElement('button');
  trashToggle.className = 'sticky-add-btn';
  trashToggle.style.cssText = 'border-style:solid; border-color:#e0ddd2; color:#999;';
  trashToggle.textContent = stickyTrashOpen ? '휴지통 접기' : ('휴지통 (' + stickyNotesTrash.length + ')');
  trashToggle.onclick = () => { stickyTrashOpen = !stickyTrashOpen; renderStickyNotes(); };
  wrap.appendChild(trashToggle);

  if(stickyTrashOpen){
    if(stickyNotesTrash.length === 0){
      const empty = document.createElement('div');
      empty.style.cssText = 'font-size:11px; color:#999; padding:6px 4px; text-align:center;';
      empty.textContent = '삭제한 메모가 없어요.';
      wrap.appendChild(empty);
    }
    stickyNotesTrash.forEach((tNote, tIdx) => {
      const tCard = document.createElement('div');
      tCard.className = 'sticky-note';
      tCard.style.background = tNote.color || STICKY_COLORS[0];
      tCard.style.opacity = '0.65';

      const tHeader = document.createElement('div');
      tHeader.className = 'sticky-note-header';
      const tTitle = document.createElement('span');
      tTitle.className = 'sticky-note-title';
      tTitle.style.cssText = 'flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
      tTitle.textContent = '삭제됨 · ' + ((tNote.title || '').trim() || stickyAutoLabel(tNote, tIdx));
      const restoreBtn = document.createElement('button');
      restoreBtn.className = 'sticky-note-close';
      restoreBtn.textContent = '↩';
      restoreBtn.title = '복원';
      restoreBtn.onclick = () => {
        stickyNotes.push(tNote);
        saveStickyNotes();
        stickyNotesTrash.splice(tIdx, 1);
        saveStickyTrash();
        renderStickyNotes();
      };
      tHeader.appendChild(tTitle);
      tHeader.appendChild(restoreBtn);
      tCard.appendChild(tHeader);

      const preview = document.createElement('div');
      preview.style.cssText = 'font-size:12px; color:#5a5228; max-height:60px; overflow:hidden;';
      preview.innerHTML = tNote.html || '<span style="color:#999;">(빈 메모)</span>';
      tCard.appendChild(preview);

      wrap.appendChild(tCard);
    });
  }
}

function initStickyNote(){
  stickyNotes = [{ html: '', color: STICKY_COLORS[0] }];
  stickyNotesTrash = [];
  try {
    stickyNotesVisible = localStorage.getItem('boardStickyNoteVisible') === '1';
  } catch(e){ stickyNotesVisible = false; }

  document.getElementById('stickyNoteToggleBtn').onclick = () => {
    if(!currentOwner){
      alert('메모를 쓰려면 먼저 상단 "내 이름 설정"에서 본인 이름을 선택해 주세요.');
      return;
    }
    stickyNotesVisible = !stickyNotesVisible;
    try { localStorage.setItem('boardStickyNoteVisible', stickyNotesVisible ? '1' : '0'); } catch(e){}
    renderStickyNotes();
  };

  renderStickyNotes();
}

const APP_PASSWORD = 'ssd2019';
let lastKnownTodayLabel = '';

function startApp(){
  lastKnownTodayLabel = formatDateLabel(new Date());
  initStickyNote();
  loadData();
  setInterval(() => {
    const nowLabel = formatDateLabel(new Date());
    if(nowLabel !== lastKnownTodayLabel){
      lastKnownTodayLabel = nowLabel;
      renderAll();
    } else {
      renderRight();
      renderWeekly();
    }
  }, 60000);
}

function tryAuth(){
  const input = document.getElementById('authPasswordInput');
  const errMsg = document.getElementById('authErrorMsg');
  if(input.value === APP_PASSWORD){
    try { localStorage.setItem('boardAuthOk', '1'); } catch(e){}
    document.getElementById('authGate').style.display = 'none';
    startApp();
  } else {
    errMsg.style.display = 'block';
    input.value = '';
    input.focus();
  }
}

let alreadyAuthed = false;
try { alreadyAuthed = localStorage.getItem('boardAuthOk') === '1'; } catch(e){ alreadyAuthed = false; }

if(alreadyAuthed){
  document.getElementById('authGate').style.display = 'none';
  startApp();
} else {
  document.getElementById('authSubmitBtn').onclick = tryAuth;
  document.getElementById('authPasswordInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') tryAuth();
  });
  document.getElementById('authPasswordInput').focus();
}
</script>
