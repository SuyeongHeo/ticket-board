<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>티켓 업무 보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.2px;
    background: #f5f4f0;
    color: #1a1a1a;
    margin: 0;
    padding: 24px 16px;
  }
  .wrap { max-width: 1400px; margin: 0 auto; }
  .sticky-notes-wrap { position: fixed; top: 90px; right: 12px; width: 210px; max-height: calc(100vh - 110px); overflow-y: auto; z-index: 10; display: flex; flex-direction: column; gap: 10px; }
  .sticky-note { width: 100%; box-sizing: border-box; background: #fff6b7; border-radius: 4px; box-shadow: 2px 4px 10px rgba(0,0,0,0.15); padding: 12px 12px 8px; flex-shrink: 0; }
  .sticky-note-body { width: 100%; box-sizing: border-box; min-height: 40px; border: none; background: transparent; font-family: inherit; font-size: 13px; line-height: 1.5; color: #3a3418; outline: none; caret-color: #1a1a1a; overflow-wrap: break-word; }
  .sticky-note-body:focus { background: rgba(255,255,255,0.45); border-radius: 3px; }
  .sticky-note-body:empty:before { content: attr(data-placeholder); color: rgba(0,0,0,0.28); }
  .sticky-toolbar { display: flex; gap: 3px; align-items: center; margin-bottom: 5px; }
  .sticky-toolbar button { background: rgba(255,255,255,0.5); border: 1px solid rgba(0,0,0,0.08); border-radius: 3px; font-size: 11px; padding: 2px 6px; height: auto; cursor: pointer; color: #5a5228; line-height: 1.4; }
  .sticky-toolbar button:hover { background: #fff; }
  .sticky-color-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); cursor: pointer; padding: 0; }
  .sticky-note-header { display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-bottom: 6px; }
  .sticky-note-title { font-size: 11px; color: #8a7f3d; font-weight: 600; }
  .sticky-note-title-input { flex: 1 1 auto; min-width: 0; background: transparent; border: none; outline: none; font-family: inherit; font-size: 11px; font-weight: 600; color: #8a7f3d; padding: 1px 2px; border-radius: 3px; text-overflow: ellipsis; }
  .sticky-note-title-input:hover { background: rgba(255,255,255,0.45); }
  .sticky-note-title-input:focus { background: rgba(255,255,255,0.75); }
  .sticky-note-title-input::placeholder { color: #8a7f3d; opacity: 0.55; font-weight: 500; }
  .sticky-note-close { background: none; border: none; cursor: pointer; font-size: 13px; color: #8a7f3d; padding: 0 2px; height: auto; }
  .sticky-add-btn { background: #fff; border: 1px dashed #d8c97d; color: #8a7f3d; border-radius: 4px; padding: 8px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  @media (max-width: 1650px) { .sticky-notes-wrap { display: none; } }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .title { font-size: 18px; font-weight: 600; }
  .sync-status { font-size: 12px; color: #888; }
  button, input, textarea, select {
    font-family: inherit;
  }
  button {
    background: #fff;
    border: 1px solid #d8d6cf;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    color: #1a1a1a;
  }
  button:hover { background: #eeece6; }
  .date-tabs { margin-bottom: 18px; }
  .date-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; font-size: 14px; font-weight: 600; }
  .date-nav button { padding: 4px 10px; font-size: 14px; }
  .date-strip { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 6px; }
  .day-cell { flex-shrink: 0; width: 46px; text-align: center; padding: 6px 0; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .day-cell:hover { background: #eeece6; }
  .day-cell .wd { font-size: 11px; color: #999; }
  .day-cell .num { font-size: 14px; margin-top: 2px; width: 26px; height: 26px; line-height: 26px; border-radius: 50%; margin-left: auto; margin-right: auto; }
  .day-cell.today .num { background: #e63946; color: #fff; }
  .day-cell.selected { border: 1.5px solid #2563eb; }
  .day-cell.has-task .num { font-weight: 700; }
  .incomplete-dot { font-size: 6px; color: #e63946; line-height: 1; margin-top: 3px; }

  #progressBar { margin-bottom: 18px; }
  .progress-wrap { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #e3e1da; border-radius: 10px; padding: 10px 16px; }
  .progress-text { font-size: 13px; color: #555; flex-shrink: 0; white-space: nowrap; }
  .progress-track { flex: 1; height: 8px; background: #eeece6; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: #2ea043; border-radius: 4px; transition: width 0.25s ease; }
  .progress-pct { font-size: 13px; font-weight: 600; color: #2ea043; flex-shrink: 0; width: 42px; text-align: right; }

  .search-item { padding: 10px 12px; border-bottom: 1px solid #efeee9; cursor: pointer; }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover { background: #f5f4f0; }
  .search-item .si-date { font-size: 11px; color: #999; }
  .search-item .si-proj { font-size: 11px; color: #666; margin-top: 1px; }
  .search-item .si-text { font-size: 13px; margin-top: 2px; }
  .search-empty { padding: 14px; font-size: 12px; color: #999; text-align: center; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 2000; display: flex; align-items: center; justify-content: center; }
  .modal-box { background: #fff; border-radius: 14px; padding: 28px 30px; width: 420px; max-width: 92vw; max-height: 88vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #efeee9; }
  .modal-field { margin-bottom: 16px; }
  .modal-label { font-size: 12px; color: #666; margin-bottom: 6px; display: block; }
  .modal-input { width: 100%; font-size: 14px; padding: 9px 11px; border: 1px solid #d8d6cf; border-radius: 8px; font-family: inherit; box-sizing: border-box; }
  .modal-row { display: flex; gap: 10px; }
  .modal-row > * { flex: 1; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .modal-actions button { padding: 9px 18px; }
  .modal-actions .primary { background: #2563eb; color: #fff; border-color: #2563eb; }

  .weekly-wrap { background: #fff; border: 1px solid #e3e1da; border-radius: 12px; padding: 14px 16px; overflow-x: auto; }
  .weekly-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .weekly-nav-title { font-size: 13px; font-weight: 600; }
  .weekly-grid { display: grid; grid-template-columns: 150px repeat(7, minmax(80px,1fr)); gap: 4px; min-width: 720px; }
  .weekly-head-cell { font-size: 11px; color: #999; text-align: center; padding: 4px 2px; }
  .weekly-head-cell.today { color: #fff; font-weight: 700; background: #e63946; border-radius: 20px; padding: 4px 8px; }
  .weekly-proj-cell { font-size: 12px; display: flex; align-items: center; gap: 5px; padding: 6px 4px; border-top: 1px solid #efeee9; }
  .weekly-day-cell { border-top: 1px solid #efeee9; padding: 4px; display: flex; flex-direction: column; align-items: stretch; gap: 3px; }
  .weekly-day-cell.today-col { box-shadow: inset 1px 0 0 rgba(230,57,70,0.45), inset -1px 0 0 rgba(230,57,70,0.45); }
  .weekly-task-line { text-align: left; border-radius: 5px; padding: 4px 6px; font-size: 11px; line-height: 1.35; cursor: pointer; word-break: break-all; }

  @media (max-width: 640px) {
    body { padding: 14px 10px; }
    .title { font-size: 16px; }
    .topbar { gap: 8px; }
    button { padding: 7px 10px; font-size: 13px; }
    .date-nav { font-size: 13px; gap: 8px; }
    .day-cell { width: 38px; }
    .day-cell .wd { font-size: 10px; }
    .day-cell .num { font-size: 13px; width: 24px; height: 24px; line-height: 24px; }
    .proj-name { font-size: 14px; }
    .proj-btns button { font-size: 12px; padding: 6px 9px; }
    .task-row { gap: 8px; }
    .task-row input[type="text"] { font-size: 15px; height: 38px; }
    .task-text { flex: 1 1 100%; order: 1; }
    .task-details { order: 2; }
    .task-deadline { width: 150px !important; order: 3; height: 38px !important; font-size: 15px !important; }
    .del-btn { padding: 8px 10px; }
    .task-row input[type="checkbox"] { width: 20px; height: 20px; order: 0; }
    .task-row .del-btn:nth-of-type(1) { order: 4; }
    .task-row .del-btn:nth-of-type(2) { order: 5; }
    textarea { font-size: 15px !important; }
    .right-title { font-size: 12px; }
    .hour-label { font-size: 10px; }
    .task-block { font-size: 13px; padding: 6px 8px; }
    .task-block-title { font-size: 13px; }
    .task-block-sub { font-size: 10px; }
  }
  .board { display: block; }
  .left-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: #666; }
  .proj-grid { display: flex; gap: 16px; align-items: flex-start; overflow-x: auto; padding-bottom: 10px; }
  .proj-card { flex: 0 0 calc((100% - 32px) / 3); min-width: 280px; padding: 12px 14px; background: #fff; border: 1px solid #e3e1da; border-radius: 10px; }
  .proj-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .proj-name { font-size: 16px; font-weight: 700; }
  .proj-btns { display: flex; gap: 6px; }
  .proj-btns button { font-size: 11px; padding: 4px 9px; }
  .task-row { display: flex; align-items: center; gap: 6px; padding: 8px 10px; margin-bottom: 6px; border: 1px solid transparent; border-radius: 8px; flex-wrap: wrap; }
  .task-row input[type="text"] { font-size: 13px; height: 32px; border: 1px solid #d8d6cf; border-radius: 6px; padding: 0 8px; }
  .task-text { flex: 1 1 0; min-width: 0; font-size: 14px !important; font-weight: 600; color: #1a1a1a; height: 34px !important; border: 1px solid transparent !important; background: transparent; padding: 0 6px !important; }
  .task-text:hover { background: #fff; }
  .task-text:focus { background: #fff; border-color: #d8d6cf !important; }
  .task-text.done { text-decoration: line-through; color: #999; font-weight: 400; }
  .task-assignee { width: 56px; flex-shrink: 0; }
  .task-deadline { width: 130px; flex-shrink: 0; font-family: inherit; font-size: 13px; height: 32px; border: 1px solid #d8d6cf; border-radius: 6px; padding: 0 8px; color: #1a1a1a; }
  .task-row input[type="checkbox"] { width: 16px; height: 16px; flex-shrink: 0; }
  .del-btn { flex-shrink: 0; padding: 5px 7px; }
  .right-panel { background: transparent; }
  .right-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: #666; flex-wrap: wrap; gap: 4px; }
  .grid-wrap { position: relative; background: #fff; border-radius: 12px; border: 1px solid #e3e1da; overflow: visible; }
  .hours-col { position: relative; width: 100%; }
  .hour-label { position: absolute; left: 0; width: 52px; font-size: 11px; color: #999; padding: 2px 6px; }
  .hour-line { position: absolute; left: 52px; right: 0; border-top: 1px solid #efeee9; }
  .task-block {
    position: absolute; left: 58px; right: 6px; min-height: 32px;
    border-radius: 0 6px 6px 0; padding: 5px 9px; font-size: 12px;
    cursor: grab; touch-action: none; user-select: none; z-index: 2;
  }
  .task-block-title { display: flex; align-items: center; gap: 5px; font-weight: 600; }
  .task-block-sub { font-size: 10px; color: #666; margin-top: 2px; }
  .empty-note { font-size: 12px; color: #999; margin-top: 8px; }
  .setup-note { font-size: 12px; color: #999; margin-bottom: 16px; padding: 10px 14px; background: #fff8e6; border: 1px solid #f0e0a8; border-radius: 8px; }
  /* =========================================================
     휴대폰 전용 레이아웃 (가로 820px 이하에서만 적용)
     - 이 블록은 좁은 화면에서만 켜지므로 PC 화면은 전혀 바뀌지 않음
     - 기능 코드(JS)는 건드리지 않고 보이는 방식만 조정
     ========================================================= */
  @media (max-width: 820px) {
    body { padding: 12px 10px; }
    .wrap { max-width: 100%; }

    /* 상단 버튼 — 두 줄로 접히고 손가락으로 누르기 좋은 크기 */
    .topbar { gap: 8px; }
    .topbar-left { width: 100%; }
    .topbar > div:last-child { width: 100%; flex-wrap: wrap; }
    .topbar > div:last-child button { flex: 1 1 auto; min-height: 40px; padding: 8px 10px; font-size: 12.5px; }
    #searchInput { flex: 1 1 100%; width: 100% !important; height: 40px !important; font-size: 15px !important; }
    #searchResults { width: 100% !important; left: 0; right: 0; }

    /* 날짜 선택 줄 */
    .date-nav { font-size: 15px; gap: 10px; }
    .date-nav button { min-width: 40px; min-height: 36px; }
    .day-cell { width: 46px; padding: 8px 0; }
    .day-cell .wd { font-size: 11px; }
    .day-cell .num { font-size: 15px; width: 30px; height: 30px; line-height: 30px; }

    /* 진행률 */
    .progress-wrap { padding: 10px 12px; gap: 8px; }
    .progress-text { font-size: 12px; }

    /* 주간보기 — 옆으로 밀어서 보고, 콘서트명과 주 이동 버튼은 제자리에 고정 */
    .weekly-wrap { padding: 12px 0 12px 12px; }
    .weekly-nav { position: sticky; left: 0; z-index: 4; background: #fff; padding-right: 12px; margin-bottom: 10px; }
    .weekly-grid { grid-template-columns: 104px repeat(7, minmax(112px, 1fr)); min-width: 888px; }
    .weekly-grid > div:first-child,
    .weekly-proj-cell { position: sticky; left: 0; z-index: 3; background: #fff; }
    .weekly-proj-cell { padding-right: 8px; box-shadow: 1px 0 0 #efeee9; font-size: 11.5px; }
    .weekly-task-line { font-size: 11.5px; padding: 5px 6px; }

    /* 콘서트별 할 일 — 한 화면에 카드 하나씩, 옆으로 넘기기 */
    .left-header { flex-wrap: wrap; gap: 8px; }
    .left-header > div { width: 100%; flex-wrap: wrap; }
    .left-header button { flex: 1 1 auto; min-height: 38px; }
    .proj-grid { gap: 10px; scroll-snap-type: x mandatory; }
    .proj-card { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; padding: 12px; }
    .proj-header { flex-wrap: wrap; gap: 6px; }
    .proj-name { font-size: 17px; }
    .proj-btns button { font-size: 12px; padding: 6px 10px; min-height: 34px; }

    /* 할 일 줄 — 체크박스 / 할 일 / 세부사항 / 버튼 순서로 정리하고 터치 영역 확보 */
    .task-row { gap: 8px; padding: 10px 8px; }
    .task-row input[type="checkbox"] { width: 22px; height: 22px; order: 0; }
    .task-text { font-size: 15px !important; height: 40px !important; flex: 1 1 0; order: 1; }
    .task-details { flex: 1 1 100%; order: 2; font-size: 14px !important; }
    .task-row .del-btn { order: 3; padding: 8px 10px; min-width: 40px; min-height: 36px; }

    /* 메모 — 오른쪽 고정 대신 본문 위에 펼쳐지도록 */
    .sticky-notes-wrap { position: static; width: 100%; max-height: none; margin: 0 0 14px; overflow: visible; }
    .sticky-note-body { font-size: 15px; }

    /* 팝업 — 화면을 거의 꽉 채우게 */
    .modal-backdrop { align-items: flex-start; padding: 8px; }
    .modal-box { width: 100% !important; max-width: 100%; max-height: 94vh; padding: 18px 14px; }
    .modal-title { font-size: 16px; margin-bottom: 12px; padding-bottom: 10px; }
    .modal-input { font-size: 16px; }
    /* 팝업 안에서 가로로 나란히 놓인 입력칸들이 눌려서 글자가 잘리지 않게 */
    .modal-box div[style*="flex:0 0"] { flex: 1 1 150px !important; }
    .modal-box select, .modal-box input { max-width: 100%; }
    .modal-actions { flex-wrap: wrap; gap: 6px; }
    .modal-actions button { flex: 1 1 auto; min-height: 42px; }
  }
</style>
</head>
<body>
<div id="authGate" style="position:fixed; inset:0; background:#f5f4f0; z-index:5000; display:flex; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:14px; padding:32px 30px; width:320px; max-width:88vw; box-shadow:0 10px 30px rgba(0,0,0,0.15); text-align:center;">
    <div style="font-size:16px; font-weight:600; margin-bottom:16px;">티켓 업무 보드</div>
    <input id="authPasswordInput" type="password" placeholder="비밀번호를 입력하세요" style="width:100%; box-sizing:border-box; font-size:14px; padding:10px 12px; border:1px solid #d8d6cf; border-radius:8px; margin-bottom:10px;">
    <div id="authErrorMsg" style="color:#c0392b; font-size:12px; margin-bottom:10px; display:none;">비밀번호가 올바르지 않아요.</div>
    <button id="authSubmitBtn" style="width:100%; background:#2563eb; color:#fff; border-color:#2563eb; padding:10px; font-size:14px;">입장하기</button>
  </div>
</div>
<div id="stickyNotesWrap" class="sticky-notes-wrap" style="display:none;"></div>
<div class="wrap">
  <div class="topbar">
    <div class="topbar-left">
      <span class="title">티켓 업무 보드</span>
      <span class="sync-status" id="syncStatus"></span>
    </div>
    <div style="display:flex; gap:8px; align-items:center; position:relative;">
      <button id="projHistBtn" title="콘서트를 골라서 완료/미완료 업무를 한 번에 보기">📋 콘서트별 업무 현황</button>
      <button id="rolloverBtn" title="어제 미완료 할 일을 오늘로 옮기기">어제 미완료 가져오기</button>
      <button id="stickyNoteToggleBtn">메모</button>
      <button id="ownerBtn">내 이름 설정</button>
      <button id="manageOwnersBtn">담당자 관리</button>
      <button id="viewFilterBtn">전체보기</button>
      <input id="searchInput" type="text" placeholder="할 일 검색" style="font-size:13px; height:34px; padding:0 12px; border:1px solid #d8d6cf; border-radius:8px; width:160px;">
      <div id="searchResults" style="display:none; position:absolute; top:40px; right:0; width:320px; max-height:360px; overflow-y:auto; background:#fff; border:1px solid #d8d6cf; border-radius:10px; box-shadow:0 4px 14px rgba(0,0,0,0.08); z-index:20;"></div>
      <button id="weeklyToggleBtn">주간 보기</button>
      <button id="todayBtn">오늘</button>
    </div>
  </div>
  <div class="setup-note" id="setupNote" style="display:none;">
    상단 코드의 API_URL 값을 본인의 Apps Script 웹앱 URL로 바꿔주세요.
  </div>
  <div class="date-tabs" id="dateTabs"></div>
  <div id="progressBar"></div>
  <div id="weeklyOverview" style="display:none; margin-bottom:18px;"></div>
  <datalist id="timeSlots"></datalist>
  <div class="board" id="dayBoardSection">
    <div id="leftPanel"></div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzonRgrcqT6osXrhP0IM24ZmynxbYT4_p6HpytL-VpW8I8Re2ZY0UrIuc4duPGesjHIZA/exec";

let data = [];
let activeIdx = 0;
let loaded = false;
const HOUR_START = 9;
const HOUR_END = 21;
const HOUR_H = 140;
const BLOCK_H = 48;
const BLOCK_GAP = 4;
const SNAP = 10;
const colorHex = ['#7F77DD','#1D9E75','#D85A30','#D4537E','#BA7517','#2B7FB8','#B03A9B','#4C8C2B','#C0392B','#1AAAA0'];
const colorMap = {};

function setStatus(text){ document.getElementById('syncStatus').textContent = text; }

function colorFor(name){
  if(colorMap[name]) return colorMap[name];
  const idx = Object.keys(colorMap).length % colorHex.length;
  colorMap[name] = colorHex[idx];
  return colorMap[name];
}

const ownerColorMap = {};
function ownerColorFor(name){
  if(!name) return '#999999';
  if(ownerColorMap[name]) return ownerColorMap[name];
  const idx = Object.keys(ownerColorMap).length % colorHex.length;
  ownerColorMap[name] = colorHex[idx];
  return ownerColorMap[name];
}

function extractConfigRows(flatTasks){
  const rest = [];
  flatTasks.forEach(t => {
    if(t.project !== CONFIG_PROJECT){ rest.push(t); return; }
    configRowIds[t.text] = t.id;
    let parsed = null;
    try { parsed = JSON.parse(t.details || 'null'); } catch(e){ parsed = null; }
    if(t.text === 'taskTemplates' && Array.isArray(parsed)) taskTemplates = migrateTemplates(parsed);
    if(t.text === 'showDates' && parsed && typeof parsed === 'object') showDates = parsed;
    if(t.text === 'projectOwners' && parsed && typeof parsed === 'object') projectOwners = parsed;
  });
  if(taskTemplates.length === 0){
    taskTemplates = [{ id: newTemplateId(), name: '기본', items: DEFAULT_TASK_TEMPLATES.map(t => Object.assign({}, t)) }];
  }
  return rest;
}

function newTemplateId(){
  return 'tpl' + Date.now() + Math.floor(Math.random() * 1000);
}

// 예전에는 템플릿이 하나(항목 배열)였음 → 이름 있는 템플릿 묶음으로 변환
function migrateTemplates(parsed){
  if(parsed.length === 0) return [];
  // base 항목이 없던 예전 데이터는 전부 공연일 기준으로 간주
  const validBase = (b) => (BASE_TYPES.some(x => x.id === b) ? b : 'show');
  const fixItems = (arr) => (Array.isArray(arr) ? arr : []).map(i =>
    Object.assign({}, i, { base: validBase(i.base) }));
  if(parsed[0] && Array.isArray(parsed[0].items)){
    return parsed.map(s => ({
      id: s.id || newTemplateId(),
      name: s.name || '이름 없음',
      items: fixItems(s.items)
    }));
  }
  return [{ id: newTemplateId(), name: '기본', items: fixItems(parsed) }];
}

function getTemplateById(id){
  return taskTemplates.find(s => s.id === id) || null;
}

function getTemplateItems(id){
  const s = getTemplateById(id);
  if(s) return s.items || [];
  return taskTemplates.length ? (taskTemplates[0].items || []) : [];
}

const configSavePending = {};
function saveConfigRow(key, value){
  // 같은 설정을 연속으로 저장할 때 중복 행이 생기지 않도록 순서대로 처리
  const prev = configSavePending[key] || Promise.resolve();
  const next = prev.catch(() => {}).then(() => {
    const json = JSON.stringify(value);
    const id = configRowIds[key];
    if(id){ return apiUpdate({ id: id, details: json }); }
    return apiAdd({
      date: '', project: CONFIG_PROJECT, text: key, assignee: '', deadline: '',
      done: false, details: json, owner: '', category: CONFIG_PROJECT,
      endDate: '', endTime: '', allDay: false, tag: ''
    }).then(r => { if(r && r.id) configRowIds[key] = r.id; return r; });
  });
  configSavePending[key] = next;
  return next;
}

function todayDate(){

  return new Date(n.getFullYear(), n.getMonth(), n.getDate());

/* 템플릿 항목이 기준으로 삼을 수 있는 날짜들.
   화면에 나오는 순서 = 실제로 일이 진행되는 순서 (공지 → 오픈 → 공연) */
const BASE_TYPES = [
  { id: 'notice', label: '오픈공지', prefix: '공지', color: '#4FB3BF', dateLabel: '오픈공지일', inputLabel: '오픈공지일' },

  { id: 'show',   label: '공연일',   prefix: 'D',    color: '#4a7fb5', dateLabel: '공연일',   inputLabel: '공연일 (첫 공연일 기준)' }
];

function baseType(id){
  return BASE_TYPES.find(b => b.id === id) || BASE_TYPES[BASE_TYPES.length - 1];
}

function baseRankOf(item){
  const i = BASE_TYPES.findIndex(b => b.id === (item.base || 'show'));
  return i === -1 ? BASE_TYPES.length : i;
}

function offsetLabel(offset, base){
  const n = Number(offset) || 0;
  const bt = baseType(base);
  if(bt.id === 'show'){
    if(n === 0) return 'D-DAY';
    return n < 0 ? ('D-' + Math.abs(n)) : ('D+' + n);
  }
  if(n === 0) return bt.prefix + '당일';
  return n < 0 ? (bt.prefix + '-' + Math.abs(n)) : (bt.prefix + '+' + n);
}

function offsetLabelColor(offset, base){
  const n = Number(offset) || 0;
  const bt = baseType(base);
  if(bt.id === 'show') return n === 0 ? '#c0392b' : (n < 0 ? '#4a7fb5' : '#8a8a8a');
  return bt.color;
}

// 템플릿 항목의 기준일 ISO 날짜 (baseDates = { show, open, notice })
function baseIsoFor(item, baseDates){

}

function dateFromOffset(showISO, offset){
  const d = fromISODate(showISO);
  d.setDate(d.getDate() + (Number(offset) || 0));
  return d;
}

/* showDates 값은 예전엔 "2026-11-26" 문자열이었고,
   지금은 { date: "2026-11-26", template: "tpl..." } 형태 — 둘 다 읽을 수 있게 함 */
function getShowDate(projName){
  const v = showDates[projName];
  if(!v) return '';
  return (typeof v === 'string') ? v : (v.date || '');
}

function getOpenDate(projName){

/* 공연일·티켓오픈은 여러 날일 수 있음 (공연 2~3일, 선예매/일반예매 등).
   목록은 showDateLists에 저장하고, 기준일(date/openDate/noticeDate)은 그중 가장 빠른 날 */
function getBaseDateList(projName, baseId){
  const v = showDates[projName];
  if(!v || typeof v === 'string'){
    // 예전 데이터: 날짜 하나만 있던 시절
    const one = (typeof v === 'string' && baseId === 'show') ? v : '';
    return one ? [{ date: one, label: '' }] : [];
  }
  const key = baseId + 'List';
  if(Array.isArray(v[key]) && v[key].length > 0){
    return v[key].filter(x => x && x.date).map(x => ({ date: x.date, label: x.label || '' }));
  }
  // 목록이 없으면 기존 단일 날짜를 한 건짜리 목록으로
  const single = baseId === 'show' ? (v.date || '') : (baseId === 'open' ? (v.openDate || '') : (v.noticeDate || ''));
  return single ? [{ date: single, label: '' }] : [];
}

function getAllBaseDateLists(projName){
  const o = {};
  BASE_TYPES.forEach(bt => { o[bt.id] = getBaseDateList(projName, bt.id); });
  return o;
}

// 목록에서 가장 빠른 날짜 (기준일)
function earliestDate(list){
  const ds = (list || []).map(x => x && x.date).filter(Boolean).sort();
  return ds.length ? ds[0] : '';
}

function getShowTemplateId(projName){

/* lists = { show:[{date,label}], open:[...], notice:[...] }
   기준일은 각 목록의 가장 빠른 날짜로 자동 계산해 함께 저장 */
function setShowDateEntry(projName, lists, templateId){
  const clean = (arr) => (arr || []).filter(x => x && x.date)
    .map(x => ({ date: x.date, label: (x.label || '').trim() }))
    .sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  const showList = clean(lists.show), openList = clean(lists.open), noticeList = clean(lists.notice);
  showDates[projName] = {
    date: earliestDate(showList),
    openDate: earliestDate(openList),
    noticeDate: earliestDate(noticeList),
    showList: showList,
    openList: openList,
    noticeList: noticeList,
    template: templateId || ''
  };
}

}

function ddayColor(projName){
  const n = getDdayNumber(projName);
  if(n === null) return '#999999';
  if(n < 0) return '#9aa0a6';
  if(n === 0) return '#c0392b';
  if(n <= 7) return '#d9534f';
  if(n <= 30) return '#d98a4a';
  return '#4a7fb5';
}

// 해당 콘서트의 미완료 할 일 수 / 그중 날짜가 이미 지난(지연) 수
function countProjectPending(projName){
  const today = todayDate();
  let pending = 0, overdue = 0;
  data.forEach(g => {
    g.projects.forEach(p => {
      if(p.name !== projName) return;
      p.tasks.forEach(t => {
        if(t.category) return;
        if(!t.text || !String(t.text).trim()) return;
        if(t.done) return;
        pending++;
        if(parseDateLabel(g.date) < today) overdue++;
      });
    });
  });
  return { pending: pending, overdue: overdue };
}

function timeToMinutes(str){
  if(!str) return null;
  const s = String(str).trim();
  let m = s.match(/(오전|오후|am|pm|AM|PM)?\s*(\d{1,2})\s*[:시]\s*(\d{0,2})/);
  if(!m) return null;
  let h = parseInt(m[2],10);
  let min = m[3] ? parseInt(m[3],10) : 0;
  const ampm = (m[1]||'').toLowerCase();
  if(ampm.indexOf('오후')>-1 || ampm==='pm'){ if(h<12) h+=12; }
  if(ampm.indexOf('오전')>-1 || ampm==='am'){ if(h===12) h=0; }
  return h*60+min;
}

function minutesToDeadlineStr(mins){
  mins = Math.max(HOUR_START*60, Math.min(HOUR_END*60+59, mins));
  let h = Math.floor(mins/60);
  let m = mins%60;
  const ampm = h < 12 ? '오전' : '오후';
  let h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return ampm + h12 + '시' + (m > 0 ? m + '분' : '');
}

function minutesToTimeStr(mins){
  mins = Math.max(HOUR_START*60, Math.min(HOUR_END*60+59, mins));
  const h = Math.floor(mins/60);
  const m = mins%60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

function to24hTime(str){
  const mins = timeToMinutes(str);
  if(mins === null) return '';
  const h = Math.floor(mins/60);
  const m = mins%60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

function dateSortKey(str){
  const m = String(str).match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
  if(!m) return 99999999;
  const d = parseDateLabel(str);
  return d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate();
}

function todaySortKey(){
  const n = new Date();
  return n.getFullYear() * 10000 + (n.getMonth()+1) * 100 + n.getDate();
}

function sortDataByDate(){
  data.sort((a,b) => dateSortKey(a.date) - dateSortKey(b.date));
}

function normalizeTimeValue(v){
  if(!v) return v;
  const s = String(v);
  // 구글 시트가 시간을 날짜 데이터로 저장한 경우(예: "1899-12-30T11:32:08.000Z")를 보정
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)){
    const d = new Date(s);
    if(!isNaN(d.getTime())){
      return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
  }
  return v;
}

function buildNested(rawTasks){
  const dateMap = {};
  const corrections = [];
  const flatTasks = extractConfigRows(rawTasks);
  flatTasks.forEach(t => {
    t.deadline = normalizeTimeValue(t.deadline);
    t.endTime = normalizeTimeValue(t.endTime);
    const canon = canonicalizeDateLabel(t.date);
    const fix = {};
    if(canon !== t.date){ fix.date = canon; }
    t.date = canon;
    // 일정의 종료일에도 같은 연도 보정을 적용
    if(t.endDate && /\d{1,2}\s*\/\s*\d{1,2}/.test(String(t.endDate))){
      const sd = parseDateLabel(canon);
      let ed;
      if(hasYearInLabel(t.endDate)){
        ed = parseDateLabel(t.endDate);
      } else {
        // 연도 없는 종료일은 시작일과 같은 해로 두고,
        // 연말(11~12월) 시작 → 연초(1~3월) 종료인 경우에만 다음 해로 넘김
        const em = String(t.endDate).match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
        const emo = parseInt(em[1],10), eda = parseInt(em[2],10);
        let ey = sd.getFullYear();
        const startKey = (sd.getMonth()+1) * 100 + sd.getDate();
        const endKey = emo * 100 + eda;
        if(endKey < startKey && sd.getMonth() >= 10 && emo <= 3) ey += 1;
        ed = new Date(ey, emo-1, eda);
      }
      // 종료일이 시작일보다 앞서면 잘못된 값이므로 시작일로 맞춤
      if(ed < sd) ed = sd;
      const endCanon = formatDateLabel(ed);
      if(endCanon !== t.endDate){ fix.endDate = endCanon; }
      t.endDate = endCanon;
    }
    if(fix.date !== undefined || fix.endDate !== undefined){
      corrections.push(Object.assign({ id: t.id }, fix));
    }
    if(!dateMap[canon]) dateMap[canon] = {};
    if(!dateMap[canon][t.project]) dateMap[canon][t.project] = [];
    dateMap[canon][t.project].push(t);
  });
  const result = [];
  Object.keys(dateMap).forEach(date => {
    const projects = Object.keys(dateMap[date]).map(pname => ({ name: pname, tasks: dateMap[date][pname] }));
    result.push({ date: date, projects: projects });
  });
  return { groups: result, corrections: corrections };
}

async function loadData(){
  setStatus('불러오는 중...');
  try {
    await loadSettings();
    const res = await apiList();
    const built = buildNested(res.tasks || []);
    data = built.groups;
    sortDataByDate();
    ensureGroupForSelectedDate();
    loaded = true;
    setStatus('동기화됨');
    if(built.corrections.length > 0){
      applyDateCorrections(built.corrections);
    }
  } catch(err){
    setStatus('연결 실패 - API_URL과 배포 권한을 확인해 주세요');
    document.getElementById('setupNote').style.display = 'block';
    data = [];
  }
  renderAll();
}

// 연도 없는 옛날 날짜를 연도 포함 형식으로 한 번에 바꿔 저장 (한 번만 돌면 끝)
async function applyDateCorrections(corrections){
  const CHUNK = 5;
  for(let i = 0; i < corrections.length; i += CHUNK){
    const slice = corrections.slice(i, i + CHUNK);
    setStatus('날짜 정리 중... ' + Math.min(i + CHUNK, corrections.length) + '/' + corrections.length);
    try {
      await Promise.all(slice.map(c => {
        const body = { id: c.id };
        if(c.date !== undefined) body.date = c.date;
        if(c.endDate !== undefined) body.endDate = c.endDate;
        return apiUpdate(body);
      }));
    } catch(e){ /* 일부 실패해도 다음 로딩 때 다시 시도됨 */ }
  }
  setStatus('동기화됨');
}

function rolloverIncompleteTasks(){
  if(!currentOwner){
    alert('먼저 상단 "내 이름 설정"에서 본인 이름을 선택해 주세요.');
    return;
  }

  const today = new Date();
  const todayLabel = formatDateLabel(today);
  const yesterday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
  const yesterdayLabel = formatDateLabel(yesterday);

  const toMove = [];
  data.forEach(g => {
    if(g.date !== yesterdayLabel) return;
    g.projects.forEach(p => {
      const projOwner = getProjOwner(p);
      p.tasks.forEach(t => {
        if(t.category || t.done) return;
        const taskOwner = t.owner || projOwner;
        if(!ownerIncludesPerson(taskOwner, currentOwner)) return;
        toMove.push({ task: t, projectName: p.name });
      });
    });
  });

  if(toMove.length === 0){
    alert('어제(' + yesterdayLabel + ') 내 미완료 할 일이 없어요.');
    return;
  }

  const ok = confirm('어제(' + yesterdayLabel + ')의 내 미완료 할 일 ' + toMove.length + '건을 오늘(' + todayLabel + ')로 옮길까요?');
  if(!ok) return;

  toMove.forEach(({ task, projectName }) => {
    moveTaskToDateAndProject(task, todayLabel, projectName);
  });
  renderAll();
}

const WEEKDAY_CHARS = ['일','월','화','수','목','금','토'];

/* 날짜 라벨 형식: "11/26(목) 2026"
   연도를 뒤에 붙이는 이유 — 예전 버전이 열려 있는 브라우저도 앞의 11/26을 그대로
   읽기 때문에 날짜가 엉키지 않고, 최악의 경우에도 연도만 떨어져 나감 */
function formatDateLabel(date){
  return (date.getMonth()+1) + '/' + date.getDate() + '(' + WEEKDAY_CHARS[date.getDay()] + ') ' + date.getFullYear();
}

// 화면 표시용: 올해면 연도 생략, 다른 해면 '27 처럼 앞에 붙임
function formatDateShort(labelOrDate){
  const d = (labelOrDate instanceof Date) ? labelOrDate : parseDateLabel(labelOrDate);
  const base = (d.getMonth()+1) + '/' + d.getDate() + '(' + WEEKDAY_CHARS[d.getDay()] + ')';
  if(d.getFullYear() === new Date().getFullYear()) return base;
  return "'" + String(d.getFullYear()).slice(2) + ' ' + base;
}

function isSameDay(a, b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function openTaskTagPicker(anchorEl, currentTag, onSelect){
  const rect = anchorEl.getBoundingClientRect();
  const tags = getKnownTaskTags();
  const select = document.createElement('select');
  select.style.cssText = 'position:fixed; top:' + (rect.bottom + 4) + 'px; left:' + Math.max(8, rect.left - 60) + 'px; z-index:999; font-size:14px; padding:6px 8px; border:1px solid #2563eb; border-radius:6px; max-width:200px;';

  const noneOpt = document.createElement('option');
  noneOpt.value = '__none__';
  noneOpt.textContent = '태그 없음';
  if(!currentTag) noneOpt.selected = true;
  select.appendChild(noneOpt);

  const newOpt = document.createElement('option');
  newOpt.value = '__new__';
  newOpt.textContent = '+ 새 태그 추가';
  select.appendChild(newOpt);

  tags.forEach(tag => {
    const opt = document.createElement('option');
    opt.value = tag;
    opt.textContent = tag;
    if(tag === currentTag) opt.selected = true;
    select.appendChild(opt);
  });

  document.body.appendChild(select);

  let handled = false;
  let outsideClickHandler = null;
  const cleanup = () => {
    if(outsideClickHandler){
      document.removeEventListener('mousedown', outsideClickHandler, true);
      outsideClickHandler = null;
    }
    if(select.parentNode) select.parentNode.removeChild(select);
  };

  select.addEventListener('change', () => {
    if(handled) return;
    handled = true;
    const val = select.value;
    const selRect = select.getBoundingClientRect();
    cleanup();
    if(val === '__new__'){
      openInlineTextInput(selRect, '태그명 입력 후 Enter', (name) => {
        if(name && name.trim()) onSelect(name.trim());
      });
    } else if(val === '__none__'){
      onSelect('');
    } else {
      onSelect(val);
    }
  });

  select.addEventListener('blur', () => { setTimeout(() => { if(!handled) cleanup(); }, 200); });
  outsideClickHandler = (e) => { if(e.target !== select){ if(!handled) cleanup(); } };
  setTimeout(() => { document.addEventListener('mousedown', outsideClickHandler, true); }, 0);

  requestAnimationFrame(() => {
    try { if(select.showPicker){ select.showPicker(); } else { select.focus(); } }
    catch(e){ select.focus(); }
  });
}

function getProjOwner(proj){
  // 콘서트 자체에 지정된 담당자가 있으면 그걸 우선 (할 일이 없어도 유지)
  if(proj && proj.name && projectOwners[proj.name]) return projectOwners[proj.name];
  if(!proj.tasks || proj.tasks.length === 0) return '';
  for(const t of proj.tasks){
    if(t.owner) return t.owner;
  }
  // 이 날짜의 할 일에 담당자가 비어 있으면, 다른 날짜의 같은 콘서트에서 담당자를 찾음
  for(const g of data){
    for(const p of g.projects){
      if(p.name !== proj.name) continue;
      for(const t of p.tasks){
        if(t.owner) return t.owner;
      }
    }
  }
  return '';
}

function countOwnerUsage(name){
  const projNames = new Set();
  data.forEach(g => {
    g.projects.forEach(p => {
      if(getProjOwner(p) === name) projNames.add(p.name);
    });
  });
  return projNames.size;
}

function getOwnerUsageProjectNames(name){
  const projNames = new Set();
  data.forEach(g => {
    g.projects.forEach(p => {
      if(getProjOwner(p) === name) projNames.add(p.name);
    });
  });
  return Array.from(projNames).sort((a,b) => a.localeCompare(b, 'ko'));
}

function getKnownOwners(){
  const names = new Set();
  data.forEach(g => { g.projects.forEach(p => { const o = getProjOwner(p); if(o) names.add(o); }); });
  knownOwnerNames.forEach(n => { if(n) names.add(n); });
  return Array.from(names).sort((a,b) => a.localeCompare(b, 'ko'));
}


function ownerBelongsToTeam(ownerStr, team){
  if(!ownerStr || !team) return false;
  if(ownerTeams[ownerStr] === team) return true;
  const parts = splitOwnerNames(ownerStr);
  return parts.some(name => ownerTeams[name] === team);
}

function ownerIncludesPerson(ownerStr, person){
  if(!ownerStr || !person) return false;
  if(ownerStr === person) return true;
  const parts = splitOwnerNames(ownerStr);
  return parts.includes(person);
}

// 콘서트명 관리에서 숨긴 콘서트는 보드에도 나오지 않게 함
function isProjectHidden(name){
  return hiddenProjectNames.indexOf(name) !== -1;
}

function getVisibleProjects(dateGroup){
  if(!dateGroup) return [];
  const base = dateGroup.projects.filter(p => !isProjectHidden(p.name));
  if(filterMode === 'all') return base;
  if(filterMode === 'tag' && currentTagFilter){
    return base.filter(p => p.tasks.some(t => t.tag === currentTagFilter));
  }
  if(filterMode === 'team' && currentTeamFilter){
    return base.filter(p => {
      const o = getProjOwner(p);
      return !o || ownerBelongsToTeam(o, currentTeamFilter);
    });
  }
  if(!currentOwner) return base;
  return base.filter(p => { const o = getProjOwner(p); return !o || ownerIncludesPerson(o, currentOwner); });
}

function getTaskEffectiveOwner(task){
  if(task.owner) return task.owner;
  if(!task.project) return '';
  for(const g of data){
    for(const p of g.projects){
      if(p.name !== task.project) continue;
      for(const t of p.tasks){
        if(t.owner) return t.owner;
      }
    }
  }
  return '';
}

function isTaskVisible(task){
  if(filterMode === 'all') return true;
  if(filterMode === 'tag' && currentTagFilter){
    return task.tag === currentTagFilter;
  }
  const effOwner = getTaskEffectiveOwner(task);
  if(filterMode === 'team' && currentTeamFilter){
    return !effOwner || ownerBelongsToTeam(effOwner, currentTeamFilter);
  }
  if(!currentOwner) return true;
  return !effOwner || ownerIncludesPerson(effOwner, currentOwner);
}

function getKnownTeams(){
  const teams = new Set();
  Object.values(ownerTeams).forEach(t => { if(t) teams.add(t); });
  return Array.from(teams).sort((a,b) => a.localeCompare(b, 'ko'));
}

// 일정 하나가 차지할 수 있는 최대 기간 (이보다 길면 데이터 오류로 보고 하루만 표시)
const MAX_EVENT_SPAN_DAYS = 120;

function eventOverlapsDay(task, day){
  const start = parseDateLabel(task.date);
  const isValidEndFormat = task.endDate && /\d{1,2}\s*\/\s*\d{1,2}/.test(String(task.endDate));
  const end = isValidEndFormat ? parseDateLabel(task.endDate) : start;
  const dKey = day.getFullYear()*10000 + (day.getMonth()+1)*100 + day.getDate();
  const sKey = start.getFullYear()*10000 + (start.getMonth()+1)*100 + start.getDate();
  let eKey = end.getFullYear()*10000 + (end.getMonth()+1)*100 + end.getDate();
  if(eKey < sKey) eKey = sKey;
  // 종료일이 비정상적으로 먼 경우(잘못 저장된 데이터)는 하루짜리로 취급.
  // 달력 전체에 같은 일정이 깔리는 것을 막기 위한 안전장치 (시트는 건드리지 않음)
  if(Math.round((end - start) / 86400000) > MAX_EVENT_SPAN_DAYS) eKey = sKey;
  return dKey >= sKey && dKey <= eKey;
}

function isEventPast(task, day){
  const now = new Date();
  const todayKey = now.getFullYear()*10000 + (now.getMonth()+1)*100 + now.getDate();
  const dayKey = day.getFullYear()*10000 + (day.getMonth()+1)*100 + day.getDate();
  if(dayKey < todayKey) return true;
  if(dayKey > todayKey) return false;
  if(task.allDay || !task.deadline) return false;
  const mins = timeToMinutes(task.deadline);
  if(mins === null) return false;
  const nowMins = now.getHours()*60 + now.getMinutes();
  return mins < nowMins;
}

function formatDisplayTime(hhmm){
  const mins = timeToMinutes(hhmm);
  if(mins === null) return '';
  const h = Math.floor(mins/60), m = mins%60;
  const ampm = h < 12 ? '오전' : '오후';
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  return ampm + ' ' + String(h12).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

function findTaskHome(task){

function reassignProjectOwnerGlobally(name, newOwner){

}

let weeklyViewOpen = true;

function moveTaskToDateAndProject(task, newDateLabel, newProjectName){
  let newEndDateLabel = task.endDate || '';
  if(task.category && task.endDate){
    const oldStart = parseDateLabel(task.date);
    const oldEnd = parseDateLabel(task.endDate);
    const spanDays = Math.round((oldEnd.getTime() - oldStart.getTime()) / 86400000);
    const newStart = parseDateLabel(newDateLabel);
    const newEnd = new Date(newStart.getFullYear(), newStart.getMonth(), newStart.getDate() + spanDays);
    newEndDateLabel = formatDateLabel(newEnd);
  }

  // 기존 위치에서 제거
  data.forEach(dateGroup => {
    dateGroup.projects.forEach(proj => {
      const idx = proj.tasks.indexOf(task);
      if(idx > -1) proj.tasks.splice(idx, 1);
    });
    dateGroup.projects = dateGroup.projects.filter(p => p.tasks.length > 0);
  });

  let targetGroup = data.find(g => g.date === newDateLabel);
  if(!targetGroup){
    targetGroup = { date: newDateLabel, projects: [] };
    data.push(targetGroup);
    sortDataByDate();
  }
  let targetProj = targetGroup.projects.find(p => p.name === newProjectName);
  if(!targetProj){
    targetProj = { name: newProjectName, tasks: [] };
    targetGroup.projects.push(targetProj);
  }
  task.date = newDateLabel;
  task.project = newProjectName;
  if(task.category && task.endDate){ task.endDate = newEndDateLabel; }
  targetProj.tasks.push(task);

  setStatus('이동 중...');
  const patch = { id: task.id, date: newDateLabel, project: newProjectName };
  if(task.category && task.endDate){ patch.endDate = newEndDateLabel; }
  apiUpdate(patch).then(() => setStatus('동기화됨'));
}

function getWeekDates(centerDate){
  const dow = centerDate.getDay();
  const mondayOffset = (dow === 0) ? -6 : (1 - dow);
  const monday = new Date(centerDate.getFullYear(), centerDate.getMonth(), centerDate.getDate() + mondayOffset);
  const week = [];
  for(let i = 0; i < 7; i++){
    week.push(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i));
  }
  return week;
}

function renderWeekly(){

  }

      });
    });

  const projNamesInWeek = [];

      if(p.tasks.length > 0 && !projNamesInWeek.includes(p.name)) projNamesInWeek.push(p.name);
    });
  });

    }

  const orderedNames = projectNameOrder.filter(n => projNamesInWeek.includes(n));

  if(filterMode !== 'mine'){
    const ownerSortKey = ownerGroupSortKey;
    orderedNames.sort((a, b) => {
      const ka = ownerSortKey(a), kb = ownerSortKey(b);
      if(ka !== kb) return ka < kb ? -1 : 1;
      return 0; // 동일 담당자 → 기존(드래그) 순서 유지
    });
  }

  if(orderedNames.length === 0){
    const empty = document.createElement('div');
    empty.style.cssText = 'grid-column: 1 / -1; font-size:12px; color:#999; padding:14px 4px;';
    empty.textContent = '이번 주에 할 일이 없어요.';

      ddayBadgeHtml(name, 9) + '</span>' +
      '<span style="display:flex; align-items:center; gap:5px;"><span style="color:#ccc; font-size:12px; flex-shrink:0;">⠿</span><span style="width:8px;height:8px;border-radius:50%;background:' + accentColor + ';flex-shrink:0;display:inline-block;"></span><span class="weekly-proj-name" style="word-break:break-all; cursor:pointer;" title="이 콘서트의 모든 할 일 보기">' + escapeHtml(name) + '</span></span>';

      draggedRowName = name;
      projCell.style.opacity = '0.4';
      if(e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', name); } catch(err){} }

// 연도가 없는 옛날 데이터에 붙여 줄 기준 연도 (이 보드를 쓰기 시작한 해)
const LEGACY_BASE_YEAR = 2026;

function parseDateLabel(label){
  const s = String(label);
  const m = s.match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
  if(!m) return new Date();
  const month = parseInt(m[1],10);
  const day = parseInt(m[2],10);
  // "11/26(목) 2026" 처럼 뒤에 붙은 연도를 찾음
  const y = s.slice(m.index + m[0].length).match(/(20\d{2})/);
  const year = y ? parseInt(y[1],10) : LEGACY_BASE_YEAR;
  return new Date(year, month-1, day);
}

function hasYearInLabel(label){
  const s = String(label);
  const m = s.match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
  if(!m) return false;
  return /(20\d{2})/.test(s.slice(m.index + m[0].length));
}

function canonicalizeDateLabel(label){
  return formatDateLabel(parseDateLabel(label));
}

function toISODate(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + d;
}

function fromISODate(str){
  const parts = str.split('-').map(n => parseInt(n,10));
  return new Date(parts[0], parts[1]-1, parts[2]);
}

function searchTasks(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const results = [];
  data.forEach(dateGroup => {
    dateGroup.projects.forEach(proj => {
      proj.tasks.forEach(task => {
        const hay = [task.text||'', task.details||'', proj.name||''].join(' ').toLowerCase();
        if(hay.includes(q)){
          results.push({ date: dateGroup.date, proj: proj.name, task: task });
        }
      });
    });
  });
  return results;
}

function renderSearchResults(query){
  const box = document.getElementById('searchResults');
  const results = searchTasks(query);
  if(!query.trim()){ box.style.display = 'none'; box.innerHTML = ''; return; }

  if(results.length === 0){
    box.innerHTML = '<div class="search-empty">검색 결과가 없어요.</div>';
    box.style.display = 'block';
    return;
  }

  box.innerHTML = '';
  results.forEach(r => {
    const item = document.createElement('div');
    item.className = 'search-item';
    item.innerHTML = '<div class="si-date">' + formatDateShort(r.date) + '</div><div class="si-proj">[' + r.proj + ']</div><div class="si-text">' + (r.task.text || '(내용 없음)') + '</div>';
    item.onclick = () => {
      selectedDate = parseDateLabel(r.date);
      ensureGroupForSelectedDate();
      renderAll();
      box.style.display = 'none';
      document.getElementById('searchInput').value = '';

  });
  box.style.display = 'block';
}

  }

}

function renameOwnerGlobally(oldName, newName){
  const newVal = normalizeOwnerString(newName);
  if(!newVal || newVal === oldName) return;
  const affectedTasks = [];
  data.forEach(g => {
    g.projects.forEach(p => {
      p.tasks.forEach(t => {
        if(t.owner === oldName){
          t.owner = newVal;
          affectedTasks.push(t);
        }
      });
    });
  });
  if(ownerTeams[oldName] !== undefined){
    ownerTeams[newVal] = ownerTeams[oldName];
    delete ownerTeams[oldName];
    saveOwnerTeams();
  }
  // 콘서트별 담당자 기록도 같이 바꿈 (할 일이 없는 콘서트까지)
  let ownerRegChanged = false;
  Object.keys(projectOwners).forEach(pn => {
    if(projectOwners[pn] === oldName){ projectOwners[pn] = newVal; ownerRegChanged = true; }
  });
  if(ownerRegChanged) saveProjectOwners();
  if(knownOwnerNames.includes(oldName) || affectedTasks.length > 0){
    knownOwnerNames = knownOwnerNames.filter(n => n !== oldName);
    if(!knownOwnerNames.includes(newVal)) knownOwnerNames.push(newVal);
    saveKnownOwnerNames();
  }
  if(currentOwner === oldName){
    setCurrentOwner(newVal);
  }
  renderAll();
  setStatus('저장 중...');
  Promise.all(affectedTasks.map(t => apiUpdate({ id: t.id, owner: newVal }))).then(() => setStatus('동기화됨'));
}

/* 할 일 없이 콘서트명만 새로 등록 */
function registerProjectName(name, owner){
  const clean = String(name || '').trim();
  if(!clean) return '';
  if(projectNameOrder.indexOf(clean) === -1){
    projectNameOrder.push(clean);
    saveProjectNameOrder();
  }
  const o = normalizeOwnerString(owner);
  if(o){
    projectOwners[clean] = o;
    registerOwnerName(o);
    saveProjectOwners();
  }
  return clean;
}

/* 콘서트명을 목록에서 완전히 지움 (할 일은 건드리지 않음) */
function deleteProjectName(name){
  projectNameOrder = projectNameOrder.filter(n => n !== name);
  saveProjectNameOrder();
  hiddenProjectNames = hiddenProjectNames.filter(n => n !== name);
  saveHiddenProjectNames();
  if(projectOwners[name] !== undefined){ delete projectOwners[name]; saveProjectOwners(); }
  if(showDates[name] !== undefined){ delete showDates[name]; saveShowDates(); }
}

/* 이 콘서트에 등록된 할 일/일정 개수 */
function countProjectTasks(name){
  let n = 0;
  data.forEach(g => g.projects.forEach(p => { if(p.name === name) n += p.tasks.length; }));
  return n;
}

function hideProjectName(name){
  if(!hiddenProjectNames.includes(name)){
    hiddenProjectNames.push(name);
    saveHiddenProjectNames();
  }
}

function unhideProjectName(name){
  hiddenProjectNames = hiddenProjectNames.filter(n => n !== name);
  saveHiddenProjectNames();
}

function moveProjectNameOrder(name, direction){
  const idx = projectNameOrder.indexOf(name);
  if(idx === -1) return;
  const swapIdx = idx + direction;
  if(swapIdx < 0 || swapIdx >= projectNameOrder.length) return;
  const tmp = projectNameOrder[idx];
  projectNameOrder[idx] = projectNameOrder[swapIdx];
  projectNameOrder[swapIdx] = tmp;
  saveProjectNameOrder();
}

function moveNameToPosition(draggedName, targetName){
  if(draggedName === targetName) return;
  const fromIdx = projectNameOrder.indexOf(draggedName);
  if(fromIdx === -1) return;
  projectNameOrder.splice(fromIdx, 1);
  let toIdx = projectNameOrder.indexOf(targetName);
  if(toIdx === -1) toIdx = projectNameOrder.length;
  projectNameOrder.splice(toIdx, 0, draggedName);
  saveProjectNameOrder();
}

function getKnownProjectNames(){
  const rawNames = new Set();
  data.forEach(g => { g.projects.forEach(p => { if(p.name && p.name.trim()) rawNames.add(p.name.trim()); }); });

  const newOnes = Array.from(rawNames).filter(n => !projectNameOrder.includes(n));
  if(newOnes.length > 0){
    newOnes.sort((a,b) => a.localeCompare(b, 'ko'));
    projectNameOrder = projectNameOrder.concat(newOnes);
    saveProjectNameOrder();
  }
  // 할 일이 하나도 없어도 콘서트명은 목록에 남겨 둠 (콘서트명 관리에서만 삭제)
  return projectNameOrder.filter(n => !hiddenProjectNames.includes(n));
}

function getOwnerForKnownName(name){
  if(projectOwners[name]) return projectOwners[name];
  for(const g of data){
    for(const p of g.projects){
      if(p.name === name){
        const o = getProjOwner(p);
        if(o) return o;
      }
    }
  }
  return currentOwner;
}

function addProjectToDateGroup(dateGroup, name){

  const newTask = { id: tempId, date: dateGroup.date, project: name, text: '', assignee: '', deadline: '', done: false, details: '', owner: owner };

  renderAll();
  setStatus('저장 중...');
  apiAdd({ date: dateGroup.date, project: name, text: '', assignee: '', deadline: '', done: false, details: '', owner: owner }).then(r => {
    newTask.id = r.id;
    setStatus('동기화됨');
  });
}

function renameProjectGlobally(oldName, newName){
  if(!newName || newName.trim() === '' || newName.trim() === oldName) return;
  const newVal = newName.trim();
  const affectedTasks = [];

  // 콘서트명 목록 / 담당자 / 공연일 기록도 같이 옮김
  const oi = projectNameOrder.indexOf(oldName);
  if(oi !== -1){
    if(projectNameOrder.indexOf(newVal) === -1) projectNameOrder[oi] = newVal;
    else projectNameOrder.splice(oi, 1);
    saveProjectNameOrder();
  }
  if(projectOwners[oldName] !== undefined){
    if(projectOwners[newVal] === undefined) projectOwners[newVal] = projectOwners[oldName];
    delete projectOwners[oldName];
    saveProjectOwners();
  }
  if(showDates[oldName] !== undefined){
    if(showDates[newVal] === undefined) showDates[newVal] = showDates[oldName];
    delete showDates[oldName];
    saveShowDates();
  }
  const hi = hiddenProjectNames.indexOf(oldName);
  if(hi !== -1){
    hiddenProjectNames[hi] = newVal;
    saveHiddenProjectNames();
  }

  data.forEach(dateGroup => {
    const matchIdx = dateGroup.projects.findIndex(p => p.name === oldName);
    if(matchIdx === -1) return;
    const matchProj = dateGroup.projects[matchIdx];
    dateGroup.projects.splice(matchIdx, 1);

    let targetProj = dateGroup.projects.find(p => p.name === newVal);
    if(!targetProj){
      targetProj = { name: newVal, tasks: [] };
      dateGroup.projects.push(targetProj);
    }
    matchProj.tasks.forEach(t => {
      t.project = newVal;
      targetProj.tasks.push(t);
      affectedTasks.push(t);
    });
  });

  renderAll();
  setStatus('저장 중...');
  Promise.all(affectedTasks.map(t => apiUpdate({ id: t.id, project: newVal }))).then(() => setStatus('동기화됨'));
}

/* 담당자 기준 정렬 키 (주간보기·전체 업무 보기가 같은 순서를 쓰도록 공용)
   팀 → 대표 담당자 → 혼자 담당(먼저)/공동 담당(나중) → 담당자 조합 전체 */
function ownerGroupSortKey(name){
  const o = getOwnerForKnownName(name) || '';
  if(!o) return '\uffff\uffff'; // 담당자 없는 건 맨 아래
  const parts = splitOwnerNames(o);
  const first = parts[0] || '';
  const team = ownerTeams[first] || '\uffff'; // 팀 미지정은 팀 그룹 뒤로
  return team + '\u0001' + first + '\u0001' +
         String(parts.length).padStart(2, '0') + '\u0001' + parts.join(', ');
}

/* 콘서트 목록을 "내 콘서트"와 "나머지"로 나눔 (각자 원래 순서는 유지) */
function splitMyProjectNames(names){
  const mine = [], others = [];
  (names || []).forEach(n => {
    const o = getOwnerForKnownName(n) || '';
    if(currentOwner && o && ownerIncludesPerson(o, currentOwner)) mine.push(n);
    else others.push(n);
  });
  return { mine: mine, others: others };
}

/* 셀렉트에 "내 콘서트 / 다른 콘서트" 묶음으로 채워 넣기 */
function fillProjectSelect(select, names, selectedValue){
  const split = splitMyProjectNames(names);
  const addGroup = (label, arr) => {
    if(arr.length === 0) return;
    const grp = document.createElement('optgroup');
    grp.label = label;
    arr.forEach(n => {
      const o = document.createElement('option');
      o.value = n; o.textContent = n;
      if(n === selectedValue) o.selected = true;
      grp.appendChild(o);
    });
    select.appendChild(grp);
  };
  if(split.mine.length > 0 && split.others.length > 0){
    addGroup('내 콘서트', split.mine);
    addGroup('다른 콘서트', split.others);
  } else {
    // 한쪽만 있으면 묶음 없이 평범하게
    (split.mine.length ? split.mine : split.others).forEach(n => {
      const o = document.createElement('option');
      o.value = n; o.textContent = n;
      if(n === selectedValue) o.selected = true;
      select.appendChild(o);
    });
  }
}

/* 지금 필터(전체/내 업무/팀별)에서 보이는 콘서트들을 보드와 같은 순서로 */
function getOrderedVisibleProjectNames(){
  const names = [];
  data.forEach(g => {
    getVisibleProjects(g).forEach(pr => {
      if(pr.tasks.length > 0 && names.indexOf(pr.name) === -1) names.push(pr.name);
    });
  });
  const ordered = projectNameOrder.filter(n => names.indexOf(n) !== -1);
  names.forEach(n => { if(ordered.indexOf(n) === -1) ordered.push(n); });
  if(filterMode !== 'mine'){
    ordered.sort((a, b) => {
      const ka = ownerGroupSortKey(a), kb = ownerGroupSortKey(b);
      return ka === kb ? 0 : (ka < kb ? -1 : 1);
    });
  }
  return ordered;
}

/* 콘서트 하나의 모든 날짜 할 일을 한 화면에서 쭉 보여 줌 */
function collectProjectTasks(projName){
  const out = [];
  data.forEach(g => {
    g.projects.forEach(pr => {
      if(pr.name !== projName) return;
      pr.tasks.forEach(t => {
        if(!t.category && !String(t.text || '').trim()) return; // 빈 줄은 제외
        out.push({ task: t, date: g.date, dateGroup: g, proj: pr });
      });
    });
  });
  out.sort((a, b) => dateSortKey(a.date) - dateSortKey(b.date));
  return out;
}
